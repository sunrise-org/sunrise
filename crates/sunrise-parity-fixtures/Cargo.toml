# Written by tools/ci/parity_fixtures_manifest.py from crates/sunrise-client/Cargo.toml: rerun it after a
# change there, never edit this file. verify-static checks it is current.
[package]
name = "sunrise-parity-fixtures"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The parity harnesses' sunrise-client fixtures, without the lib test (CI only)"
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

# sunrise-client's own lib.rs is the program's root: its `main` is cfg(sunrise_parity_fixtures).
[[bin]]
name = "sunrise-parity-fixtures"
path = "../sunrise-client/src/lib.rs"
required-features = ["fixtures"]
test = false
bench = false
doc = false

[lints]
workspace = true

[build-dependencies]
sunrise-game-discovery = { path = "../sunrise-game-discovery" }

[dependencies]
sunrise-hooks = { path = "../sunrise-hooks", features = ["test-support"], optional = true }
sunrise-mod-runtime = { path = "../sunrise-mod-runtime", features = ["test-work-count"], optional = true }
mod_api = { package = "sunrise-mod-vocab", path = "../sunrise-mod-vocab", features = ["testing"], optional = true }
sunrise-mod-api-macros = { path = "../sunrise-mod-api-macros", optional = true }
sunrise-client-lib = { path = "../sunrise-client-lib", default-features = false, features = ["test-menu-validity", "test-payload-probe", "test-publication-scope", "test-residency-observer", "test-dry-side", "test-tooltip-factories", "test-pack-feedback", "test-resource-cache", "test-still-clock", "test-support"], optional = true }
sunrise-gameplay = { path = "../sunrise-gameplay", features = ["test-support"], optional = true }
sunrise-gameplay-common = { path = "../sunrise-gameplay-common", features = ["test-support"], optional = true }
sunrise-client-gameplay = { path = "../sunrise-client-gameplay", optional = true, default-features = false }
sunrise-assets = { path = "../sunrise-assets", optional = true }
sunrise-game-data = { path = "../sunrise-game-data", features = ["test-language-publication", "test-effect-registry"], optional = true }
sunrise-client-input = { path = "../sunrise-client-input", optional = true }
sunrise-client-render = { path = "../sunrise-client-render", features = ["test-support"], optional = true }
sunrise-command = { path = "../sunrise-command", optional = true }
sunrise-items = { path = "../sunrise-items", features = ["test-support"], optional = true }
sunrise-core = { path = "../sunrise-core", optional = true }
sunrise-threads = { path = "../sunrise-threads", features = ["test-allocation-count", "test-game-dir"], optional = true }
sunrise-perf-format = { path = "../sunrise-perf-format", optional = true }
sunrise-world = { path = "../sunrise-world", features = ["test-support"], optional = true }
sunrise-sim = { path = "../sunrise-sim", optional = true }
sunrise-level = { path = "../sunrise-level", optional = true }
sunrise-protocol = { path = "../sunrise-protocol", optional = true }
sunrise-server-files = { path = "../sunrise-server-files", optional = true }
sunrise-server-profiles-http = { path = "../sunrise-server-profiles-http", optional = true }
sunrise-java-properties = { path = "../sunrise-java-properties", optional = true }
sunrise-narrator = { path = "../sunrise-narrator", optional = true }
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false, features = ["runtime-process", "folder"], optional = true }
winit = { version = "0.30.13", optional = true }
glam = { version = "0.30", optional = true }
png = { version = "0.18", optional = true }
sha2 = { version = "0.10.9", optional = true }
cipher = { version = "0.4", default-features = false, features = ["zeroize"], optional = true }
crypto-common = { version = "0.1", default-features = false, features = ["getrandom"], optional = true }
digest = { version = "0.10", default-features = false, features = ["mac"], optional = true }
fnv = { version = "1", optional = true }
socket2 = { version = "0.6", default-features = false, features = ["all"], optional = true }
sha1 = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", features = ["raw_value"], optional = true }
toml = { version = "1.1", optional = true }
indexmap = { version = "2", optional = true }
log = { version = "0.4", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"], optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"], optional = true }
sunrise-system = { path = "../sunrise-system", optional = true }
sunrise-telemetry = { path = "../sunrise-telemetry", default-features = false, optional = true }
sunrise-bench = { path = "../sunrise-bench", optional = true }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"], optional = true }
cap-std = { version = "3.4.6", optional = true }
cap-fs-ext = { version = "3.4.6", optional = true }
tempfile = { version = "3", optional = true }
bytemuck = { version = "1.24", features = ["derive"], optional = true }
sunrise-shaders = { path = "../sunrise-shaders", optional = true }
mod_platform = { package = "sunrise-mod-api", path = "../sunrise-mod-api", features = ["engine-test-platform"], optional = true }
sunrise-perf = { path = "../sunrise-perf", optional = true }

[target."cfg(unix)".dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time", "process", "fs"], optional = true }

[target."cfg(target_os = \"linux\")".dependencies]
libc = { version = "0.2", features = ["extra_traits"], optional = true }

[features]
client = ["dep:cap-fs-ext", "dep:cap-std", "dep:chrono", "dep:cipher", "dep:crypto-common", "dep:digest", "dep:flate2", "dep:fnv", "dep:fs4", "dep:glam", "dep:indexmap", "dep:libc", "dep:png", "dep:sha1", "dep:sha2", "dep:socket2", "dep:sunrise-client-gameplay", "dep:sunrise-client-input", "dep:sunrise-client-lib", "dep:sunrise-client-render", "dep:sunrise-narrator", "dep:ureq", "dep:winit", "dep:zip", "sunrise-client-gameplay/client"]
testing = []
test-support = ["sunrise-client-gameplay?/test-support"]
state-digest = ["sunrise-gameplay/state-digest"]
audio = ["client", "sunrise-client-gameplay/audio"]
controllers = ["client", "sunrise-client-gameplay/controllers"]
sunrise-extras = ["client", "friends", "sunrise-client-gameplay/sunrise-extras"]
friends = ["sunrise-client-gameplay?/friends"]
rng-trace = ["sunrise-core/rng-trace", "sunrise-client-gameplay?/rng-trace", "sunrise-client-lib?/rng-trace"]
system-allocator = ["sunrise-threads/system-allocator", "sunrise-gameplay-common/system-allocator"]
alloc-count = ["sunrise-threads/alloc-count", "sunrise-gameplay-common/alloc-count"]
alloc-census = ["sunrise-threads/alloc-census"]
windows-segment-heap = []
client-defaults = ["fixtures", "sunrise-client-gameplay/parity-fixtures", "client", "audio", "controllers", "sunrise-extras"]
fixtures = ["dep:sunrise-hooks", "dep:sunrise-mod-runtime", "dep:mod_api", "dep:sunrise-mod-api-macros", "dep:sunrise-client-lib", "dep:sunrise-gameplay", "dep:sunrise-gameplay-common", "dep:sunrise-assets", "dep:sunrise-game-data", "dep:sunrise-client-render", "dep:sunrise-command", "dep:sunrise-items", "dep:sunrise-core", "dep:sunrise-threads", "dep:sunrise-perf-format", "dep:sunrise-world", "dep:sunrise-sim", "dep:sunrise-level", "dep:sunrise-protocol", "dep:sunrise-server-files", "dep:sunrise-server-profiles-http", "dep:sunrise-java-properties", "dep:sunrise-mod-package", "dep:png", "dep:serde", "dep:serde_json", "dep:toml", "dep:log", "dep:sunrise-system", "dep:sunrise-telemetry", "dep:sunrise-bench", "dep:zip", "dep:tempfile", "dep:bytemuck", "dep:sunrise-shaders", "dep:mod_platform", "dep:sunrise-perf", "dep:rustix", "test-support", "sunrise-gameplay-common/parity-fixtures", "sunrise-gameplay/parity-fixtures"]
