[package]
name = "sunrise-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Sound playback for the client: vanilla's SoundEngine bookkeeping, the mixer standing in for OpenAL, Ogg/Vorbis decoding, microphone capture and the sound sources; no GPU"

[dependencies]
sunrise-assets = { path = "../sunrise-assets" }
sunrise-client-core = { path = "../sunrise-client-core" }
sunrise-core = { path = "../sunrise-core" }
sunrise-hooks = { path = "../sunrise-hooks" }
mod_api = { package = "sunrise-mod-vocab", path = "../sunrise-mod-vocab" }
sunrise-world = { path = "../sunrise-world" }
# Sound output (ALSA on Linux); the `audio` feature.
cpal = { version = "0.16", optional = true }
glam = "0.30"
log = "0.4"
serde_json = { version = "1.0.151", features = ["raw_value"] }
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd"))'.dependencies]
# CPAL 0.16's ALSA enumeration drops failed opens and hides the PCM addresses.
alsa = { version = "0.9", optional = true }
libc = { version = "0.2", optional = true }

# The microphone's native APIs (audio/mic.rs): ALSA's capture controls on Linux and the BSDs, CoreAudio's input
# streams on macOS. Windows' microphone goes through cpal alone.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "macos"))'.dependencies]
sunrise-audio-input = { path = "../sunrise-audio-input", optional = true }

[features]
# Sound output and input: sunrise-client's `audio` feature.
audio = ["dep:cpal", "dep:alsa", "dep:libc", "dep:sunrise-audio-input"]
# Helpers sunrise-client's tests build their fixtures with.
test-support = []

[dev-dependencies]
mod_platform = { package = "sunrise-mod-api", path = "../sunrise-mod-api", features = ["testing"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
