[package]
name = "sunrise-client-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's lowest layer: chat text and translations, SNBT and NBT paths, the scoreboard, boss bars, game rules and the registry and particle tables commands name"

[dependencies]
log = "0.4"
sunrise-assets = { path = "../sunrise-assets" }
sunrise-core = { path = "../sunrise-core" }
mod_api = { package = "sunrise-mod-vocab", path = "../sunrise-mod-vocab" }
sunrise-world = { path = "../sunrise-world" }
serde_json = { version = "1.0.151", features = ["raw_value"] }

[dev-dependencies]
# The load/loop readers' tests install scoped mod fixtures.
mod_platform = { package = "sunrise-mod-api", path = "../sunrise-mod-api", features = ["testing"] }

[features]
# Mutable thread-local language publication for resource-backed game fixtures only.
test-language-publication = []
# Thread-local content mod effect registries for test fixtures only.
test-effect-registry = []

[lints]
workspace = true
