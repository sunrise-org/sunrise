ids = ["method:prelude::ItemsHost::entity_type_dimensions", "type:EntityTypeDimensions", "handle:EntityTypeDimensions::new"]
why = "A mod reads an entity type's registered size without spawning one (#6127): `ItemsHost::entity_type_dimensions(entity_type)` is `EntityType.getDimensions()`, the `EntityDimensions` width, height and eye height of vanilla's types and mods' (a mod type has its template's row), on both sides. It is the default before any `entity_size` answer for a live entity, a baby's size or a scale attribute, so a mod can test whether a mob would fit at a position or size a spawn range, as Ender IO's powered spawner does, without spawning and removing one (which fires join and leave hooks other mods see). The read is `getDimensions()` and does not carry `EntityType.spawnDimensionsScale`: `getSpawnAABB` is `spawnDimensionsScale * width / 2` either side of x and z and `spawnDimensionsScale * height` up from y, with the scale 4.0 for the slime and the magma cube, 2.0 for the sulfur cube and 1.0 otherwise, so a mod testing a cube mob's spawn box applies it itself. `fixed` (`EntityDimensions.fixed`) is not read: the game's entity type table does not carry it."
migrate = "Additive: nothing to change. A mod that spawned a mob once to read its box can call host.entity_type_dimensions(\"minecraft:zombie\")."
