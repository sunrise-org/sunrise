ids = ["handle:PlayerRef::touch_item", "handle:PlayerRef::touch_orb", "type:PickupError"]
why = "A mod makes a player collect a given item entity or experience orb now, through the game's own pickup (#6126), for a living player and outside a transaction (PickupError::InTransaction, since an abort could not undo a pickup): the pickup delay and target checks, item_picked_up and item_picked_up_post, Inventory.add, the statistic, the take animation and sound, Mending and the experience points for an orb, honouring takeXpDelay. Magnet items call ItemEntity.playerTouch and ExperienceOrb.playerTouch this way. pickup_xp (NeoForge's PlayerXpEvent.PickupXp, fired inside ExperienceOrb.playerTouch) now also fires for the host's own player on the integrated server and a LAN host, on its pickup pass and on touch_orb, where before it fired only for guests; the host's pass now discards a used-up orb through Entity.discard, so entity_leave_level hears it."
migrate = "Additive: nothing to change. A pickup_xp listener now also hears the host's own player."
