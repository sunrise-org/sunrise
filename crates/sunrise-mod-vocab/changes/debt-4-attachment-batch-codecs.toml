why = "Attachment queries capture live bindings, including values with no saved form. The old Wire encoding silently omitted rows and could rebuild a write identity from bytes. Queries, holder selectors, write tokens, errors and Part state bookkeeping now stay in process. Saving and synchronization still encode attachment values through the declared codec."
migrate = "Replace Writer::put(&batch) or Reader::decode::<AttachmentBatch>(bytes) with a local host.query(&KEY)? (import AttachmentQueries), then use query.iter() or query.get(holder). Replace Reader::decode::<AttachmentWriteToken>(bytes) with host.query_mut(&KEY)? (import AttachmentQueriesMut) and call row.set(host, value) or row.remove(host) on an issued row. Instead of row.write_token().parts(), retain the row or copy only its holder for local lookups; a residency generation is not saved or synced data. Keep passing Holder or AttachmentHolder to local calls and handling attachment and Part errors as Rust values. Keep AttachmentForm, AttachmentPolicy, AttachmentWrite, Part declarations and EntityResidency in local storage or registration code. For disk or attachment sync, set KEY's AttachmentCodec and sync policy as before. For a custom message, replace any of these types in a Wire field or bound with your own derived payload record containing only the needed data, such as a stable ID or an explicit error code; do not use the payload to recreate a holder or write token."
