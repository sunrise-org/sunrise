ids = ["hook:can_equip"]
why = "A can_equip Part reads through a read-only Host, and MenuRef::slot_holds on an armour slot asks ArmorSlot.mayPlace (vanilla LivingEntity.isEquippableInSlot, NeoForge IItemExtension.canEquip) again, so a Part that read the slot it was asked about recursed until the stack overflowed, on the server and, now that slot_holds answers there, on the client. can_equip Parts are no longer asked again while one runs on the same thread: a nested equip question keeps the stack's own equippable answer, as nested menu_slot_rules reads keep the slot's own answers. Hook version bumped from 3 to 4 because a nested question about another listening item no longer reaches its Part."
migrate = "Rebuild for `can_equip` version 4 and set `hook_version = 4` if your manifest pins it. The callback is unchanged. A MenuRef::slot_holds or slot_gives made inside can_equip now answers the armour slots with the stack's equippable data; ask outside the callback for an answer that includes can_equip Parts."
