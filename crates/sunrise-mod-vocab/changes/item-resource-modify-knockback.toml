ids = ["handle:ItemResource::modify_knockback"]
why = "Adds ItemResource::modify_knockback (#4983): EnchantmentHelper.modifyKnockback of a stack against a victim, from a damage type id and its direct and causing entities as EntityRef::hurt takes them, with requirements checked on a copy of the level's random and values applied on a copy of the victim's own, the fall and flying state of the three entities in the context, and without equipping the stack. Server only: None on a client, for an unknown item, a stale victim, an unregistered damage type, or a victim, direct or causing entity in another level."
