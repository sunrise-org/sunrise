ids = ["type:item::menu::AnvilCraftInputs.xp_cost"]
why = "`AnvilCraftInputs` gains `xp_cost`, the raw pre-take level cost `AnvilMenu.onTake` reads as `cost` before it changes anything (NeoForge listeners reach it as `AnvilMenu.getCost()`), so a listener that cancels `anvil_craft_pre` can read the amount for the XP charge (not perform the whole take). `anvil_craft_pre` and `anvil_craft_post` borrow the same struct and see the same value. The snapshot does not expose the applied repair count. Hook versions stay: existing listeners read the same fields with the same meaning, and the cancel contract is unchanged."
migrate = "Rebuild against the current SDK. A mod that builds an `AnvilCraftInputs` literal adds the field; a listener that only reads `left`, `right` and `output` compiles unchanged."
