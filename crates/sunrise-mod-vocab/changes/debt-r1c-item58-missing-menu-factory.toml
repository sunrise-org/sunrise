ids = ["method:MenusRegistrar::register_menu_screen", "method:MenusRegistrar::menu_recipe_book"]
why = "Vanilla MenuScreens.create and NeoForge MenuScreens.getScreenFactory warn and return before changing the active menu when no constructor is registered. Recipe-book roles and permanent slot exclusions are still checked at content load, independently of client screen registration."
migrate = "Keep r.menu_recipe_book(menu, &book, recipe_type, roles) for the recipe roles. If migrating from the form with a fifth screen argument, move that layout into r.register_menu_screen(menu, factory) and set layout.recipe_book = Some(book.clone()). Existing registrations need no code changes. A factory is required to show a custom menu or a stock opener with excluded slots, not to load its content. Without one, the client keeps its current menu and sends no close packet."
