ids = [
    "method:prelude::ResourcesHost::resource",
    "method:prelude::ResourcesHost::open_resource",
    "type:ResourceOpenError",
    "type:ResourceOpenError.Io",
]
why = "Vanilla FallbackResourceManager.getResource checks each pack's own file before its filter can hide lower files; Resource.open asks only that file's IoSupplier for a stream, and MinecraftServer.reloadResources publishes the selection after loading it. NeoForge MultiPackResourceManager couples namespace and path filters, and JarContentsPackResources.getResource opens the selected entry lazily. The native API no longer allocates the entire file on lookup, imposes the old guest reply limit MAX_RESOURCE_BYTES, returns a renderer's merged bytes, or conflates I/O failure with absence. `resource_stack` still reads merged layers under the old limit until it reads the original packs the same way."
migrate = "Replace host.resource(pack_type, &id) with host.open_resource(pack_type, &id). Handle Err(error) separately from Ok(None); ResourceOpenError::Io contains the original I/O error. In Ok(Some(mut reader)), use std::io::Read while the host is borrowed. For owned bytes, use let mut bytes = Vec::new(); reader.read_to_end(&mut bytes)?; and handle read errors. Remove MAX_RESOURCE_BYTES imports and checks; apply any required limits in your own decoder."
