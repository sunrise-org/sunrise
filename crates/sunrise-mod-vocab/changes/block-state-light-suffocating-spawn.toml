ids = ["handle:BlockStates::light_dampening", "handle:BlockStates::is_suffocating", "handle:BlockStates::is_valid_spawn", "handle:LevelRef::state_is_suffocating"]
why = "Three per-state answers a mod asks of other states (#6035). `BlockStates::light_dampening` is `BlockStateBase.getLightDampening` (0 to 15: stone 15, water and leaves 1, glass and air 0), the dampening Applied Energistics 2's cable bus needs. `BlockStates::is_suffocating` is `BlockState.isSuffocating` for the state alone, from the block's own predicate as the level's suffocation rules bind it (stone, mud, an unextended piston yes; glass, leaves, a moving piston no), the open world's data packs' `#minecraft:causes_suffocation` included; it is None for a state whose answer needs the position or a block entity (a shulker box, a published or offset shape). `LevelRef::state_is_suffocating(host, state, pos)` (state then position, as `visit_block_shape` takes them) answers those at a position for a supplied state that need not be placed there (`BlockState.isSuffocating(level, pos)`): a shulker box suffocates unless the `ShulkerBoxBlockEntity` at `pos` is not closed, as `Blocks.shulkerBox`'s predicate reads it, and a published or offset shape is tested at `pos`; it reads the same rules as `BlockStates::is_suffocating`, and is None for collision data that cannot answer. `BlockStates::is_valid_spawn(state, entity_type)` is `BlockState.isValidSpawn` from the table natural spawning reads, a block's declared `spawn_rule` included, so a camouflaged block like Elevator answers as the block it shows; the game's spawning reads no position for it, and it is None for an entity type the game has no spawn species for."
migrate = "Nothing to change; a mod that approximated these from shapes and a list of see-through blocks can call the reads, and a camouflaged block asks `LevelRef::state_is_suffocating` with the state it shows."
