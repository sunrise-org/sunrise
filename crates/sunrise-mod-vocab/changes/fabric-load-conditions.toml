ids = ["hook:register_load_conditions"]
why = "Fabric API's fabric:load_conditions key is read beside neoforge:conditions (fabric-resource-conditions-api-v1's ResourceConditionsImpl.applyResourceConditions and DefaultResourceConditionTypes), so a Java jar's data files that only Fabric guards load as they do on Fabric. A registered handler is now also asked for a Fabric condition named by its ID, with its arguments minus the condition key, and Fabric's built-in IDs (fabric:true, fabric:false, fabric:not, fabric:and, fabric:or, fabric:all_mods_loaded, fabric:any_mods_loaded, fabric:tags_populated, fabric:features_enabled, fabric:registry_contains) are refused as registrations like NeoForge's."
migrate = "Change any hook_version pin for register_load_conditions from 3 to 4. A handler reads its arguments as before; the key that named the condition (type or condition) is never among them. Register a Fabric built-in ID under your own namespace instead."
