ids = ["method:GuiCanvas::entity", "type:GuiDrawError.Entity"]
why = "GuiCanvas::entity draws a living entity under the canvas's pose and scissor (#6023), as DrawContext::entity draws it in a screen: InventoryScreen.extractEntityInInventoryFollowsMouse, and GuiGraphicsExtractor.entity for a fixed turn. Item decorators draw into a GuiCanvas since the scoped GUI drawing change, which had no entity primitive, so a decoration could no longer show a mob over its item, as Hostile Neural Networks' data model does. The view's box is in local GUI pixels; the entity is cut off at that box, which turns with a rotated pose, and at the scissor. A refusal from the entity draw is GuiDrawError::Entity(GuiEntityError), except GuiEntityError::Unavailable, which is GuiDrawError::Unavailable."
migrate = "Nothing to change for mods: additive. Only the engine implements GuiCanvas. In an item decoration, call event.draw.entity(&GuiEntity::kind(\"minecraft:zombie\"), GuiEntityView::new([x0, y0, x1, y1], size, offset_y, look)) with the box in the decoration's local GUI pixels; a match on GuiDrawError keeps its wildcard arm, as the enum is non-exhaustive."
