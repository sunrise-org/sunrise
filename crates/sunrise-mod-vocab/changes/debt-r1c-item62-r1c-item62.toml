ids = ["type:EntityRenderAttachments", "type:EntityRenderState", "type:LivingRenderState", "type:PaintingRenderState", "type:ItemFrameRenderState"]
why = "Entity rendering shares a frozen generation instead of re-encoding attachments. Vanilla SynchedEntityData.packDirty and ServerEntity.sendPairingData form the values before handing them to the packet, and NeoForge AttachmentSync.syncInitialEntityAttachments prepares its payload before adding it to pairing. NeoForge RegisterRenderStateModifiersEvent anchors keyed render state. Sunrise logs each refusal of a whole over-budget render generation and leaves the last published one unchanged. With no previous generation the entity stays hidden until a complete one fits. Render state and its subtypes no longer implement Wire; attachment disk and sync codecs are unchanged."
migrate = "Keep EntityRenderer::submit and snapshot.get(&KEY). For a general entity, read the published generation from state.attachments; remove any branch that interprets None as an over-budget generation. None means another entity family. Use Ok(None) from snapshot.get(&KEY) to detect a missing key. If an update exceeds the budget, submit continues to see the previous whole generation, or is not called if the entity has never published one. Within the native process borrow or clone render state instead of round-tripping it through Wire. For a payload, define your own #[derive(Wire)] record and fill its fields explicitly."
