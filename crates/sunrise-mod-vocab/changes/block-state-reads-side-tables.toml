ids = ["handle:BlockStates::is_correct_tool_for_drops"]
why = "`BlockStates::is_correct_tool_for_drops` read the game's own item table, so a world's data pack that rebinds a tool rule's block tag (`#minecraft:mineable/pickaxe`) changed the game's harvest but not this answer. Through a host it now reads the side's item table, the open world's as its data packs bind it, the one the game's own harvest check reads; with no world packs the answer is unchanged."
migrate = "Nothing to change."
