why = "Mods can declare their own static registries, as NeoForge's NewRegistryEvent and RegistryBuilder do: a library mod calls Registrar::declare_registry with a RegistryKey<T> and RegistryOptions (default_key, sync) from Hooks::register, any mod registers entries into it with Registrar::register_entry, and the registry freezes at startup. Entries are read through HostRegistries::registry (every Host, and ReloadContext) as a CustomRegistry<T> by EntryKey<T>, by id, or by default. Tag files under data/<namespace>/tags/<registry namespace>/<registry path>/ bind into the world's tag store and are read with Tags::entries and Tags::is_in_custom_tag. Membership uses the bound set on the server and scans the received tag once on the client without allocating a member list. A registry declared sync(true) is sent to Sunrise clients during configuration (skipped for the in-process single-player connection, as in ConfigurationInitialization.configureEarlyTasks): a client missing a registry or an entry the server sent is disconnected naming it, and tags travel under the server's numeric ids. A side = server package may not declare or register into a synced registry. Registrar gains a hidden supertrait for the registration calls, which changes its supertrait bounds."
migrate = "Nothing to migrate. To share a registry, declare it in the library mod (declare_registry(RegistryKey::new(\"chemlib:gas\"), RegistryOptions::new().default_key(\"chemlib:empty\").sync(true))), export the RegistryKey constant and the value type, and register entries with register_entry in the library and in dependent mods (inside if_installed! when the library is optional). Read entries in a hook with host.registry(KEY), and tags with tags.entries(KEY, tag)."
