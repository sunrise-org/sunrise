ids = ["method:GuiCanvas::fluid", "type:GuiDrawError"]
why = "GuiCanvas::fluid draws a fluid stack over a rectangle (#6123): fluid(&FluidStack, [x, y, w, h]) tiles the fluid's still sprite at its own pixel size from the top left, times its tint, the appearance an item's fluid layer and the world draw (a registered fluid model, else the look in data/<mod>/sunrise/fluid/, else water's; NeoForge IClientFluidTypeExtensions getStillTexture and getTintColor). Vanilla water draws block/water_still times 0xFF3F76E4, lava block/lava_still untinted; a fluid no model knows draws the missing sprite. It honours the canvas pose and scissor. GuiDrawError gains UnknownFluid, returned for a fluid that is not registered."
migrate = "Call canvas.fluid(&stack, rect) inside DrawContext::draw_gui or an item decorator's canvas instead of guessing a block/<fluid>_still sprite and tint. Let the non-exhaustive match on GuiDrawError handle UnknownFluid."
