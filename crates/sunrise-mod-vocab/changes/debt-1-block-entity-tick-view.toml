why = """
A resident server block entity can be read and edited in place without a payload snapshot, reply, or per-listener savepoint. Taking the Host and borrowing the subject are sequential operations. Dispatch and each loan check the live block against the entity type rather than pinning the tick-start state, following vanilla `LevelChunk.setBlockState`, `LevelChunk.BoundTickingBlockEntity.tick` and `BlockEntityType.isValid`; NeoForge's `LevelChunk` patch keeps the same pre-ticker test and warn-once diagnostic, reset after a valid tick. The published `block_entities.tick` loop runs no after-slot when an incompatible block prevented the ticker from running.
Menu data slots have no synthetic 256-slot cap, matching vanilla `AbstractContainerMenu.addDataSlots`/`broadcastChanges`. Block-backed sync uses the nonnegative signed-short index range of vanilla `ClientboundContainerSetDataPacket`. The separate revision-2 blockless payload retains its unsigned-short index and full `i32` value for both snapshots (`AbstractContainerMenu.sendAllDataToRemote`/`broadcastFullState`) and committed deltas, without sending or wrapping the slots beyond that range. No new opening negotiation is required (see NeoForge's `ServerPlayer.openMenu` extension for negotiated opening data). `MenuScreenOpen.data_slots` reports the declared count, or `0` for dynamic stock menus, not a hardcoded capacity.
Neither ticker-view writes nor handle menu-data writes mark the chunk unsaved; persisted changes require an explicit `set_changed` call, as in vanilla `BlockEntity.setChanged` and `AbstractFurnaceBlockEntity.serverTick`. `Items` belongs to the inventory codec only for an inventory holder (vanilla `BlockEntity.loadAdditional`/`saveAdditional` and `ContainerHelper.loadAllItems`/`saveAllItems`, as used by `AbstractFurnaceBlockEntity`). Like NeoForge's `BlockEntity.loadAdditional`/`saveAdditional` handling of mod-owned data, a slotless holder applies and saves its mod payload without interpreting or reordering lists.
"""
migrate = """
`block_entity_tick` bumps to `hook_version = 4`. A type that does not support the current block no longer ticks at all; a callback that did start can still lose its subject between loans. Change `fn block_entity_tick(&self, host, event: &mut BlockEntityTickEvent)` to `fn block_entity_tick(&self, event: &mut BlockEntityTickEvent<'_>)`. Instead of reading a handle through `host` or modifying `event.entity` and setting `event.reply`, call `event.subject.with_view(|mut subject| { ... })`. Reborrow after an in-place property update to get the live `subject.state()`; removal, replacement, or an invalid block still returns `None`. Keep `subject.handle()` only for later calls. To use another object, return any owned input from the view closure, then borrow `event.subject.host()`.
Native `block_entities.tick` slots keep the same `before` and `after` signatures. If `BlockEntityTickSlot::before` leaves the resident mod block entity on an incompatible block, do not expect `BlockEntityTickSlot::after` for that visit; move any work that must happen for a skipped visit into `before`.
Use `subject.set_data_slot` for existing menu data and `subject.set_data_slots` to initialize or resize it; replace result handling for `subject.set_data_slots` with a direct `bool` test. Remove `BlockEntityDataError::TooManySlots` match arms. `BlockEntityRef::set_data_slots` still returns `Result<bool, BlockEntityDataError>` for `Stale` and `Unavailable`, with no 256-slot cap. Use `subject.set_item_slot` for internal stacks and `subject.set_nbt` for saved fields. On a holder where `item_slots() == 0`, use `subject.set_nbt("Items", ...)` to write or remove mod-owned NBT; `subject.nbt()` returns that field verbatim after a chunk reload, including its original list order. Neither the ticker view nor the handle menu-data setters automatically dirty the chunk: after a persisted change, call `handle.set_changed(host)` explicitly. To commit subject edits and neighbor or dropped-item edits together, use `event.subject.transaction`, recheck source values after taking the Host, and return `Err` on a stale subject or failed write. A tick no longer commits a reply or starts a transaction for you.
For `hook:block_entity_load_additional` (`hook_version = 3`) and `hook:block_entity_save_additional` (`hook_version = 4`), continue using the same Part methods. In `type:BlockEntityLoadAdditionalEvent.tag` (`hook:block_entity_load_additional.tag`), read slotless `Items` as mod-owned NBT rather than expecting canonical-looking rows to be absent. In `type:BlockEntitySaveAdditionalEvent.tag` (`hook:block_entity_save_additional.tag`) and the reads `handle:BlockEntityRef::data` and `method:LevelHost::block_entity_data`, read slotless `Items` in its saved list order rather than expecting reconstruction in slot order. Use the same storage/handle methods for inventory slots declared by the mod; the engine still owns those slots.
In `MenuScreenFactory::create`, don't treat `MenuScreenOpen.data_slots` as received data (or `0` as no dynamic stock data). Use `MenuScreenFrame.data.get(index)` as values arrive. Keep synchronized indices in `0..=i16::MAX` for a block-backed menu and `0..=u16::MAX` for a blockless menu; larger indices stay in memory. `PlayerRef::open_mod_menu` still takes one initial `i32` per declared index and `MenuRef::set_data_slot` still takes the declared index. A client that already negotiated the required blockless layout still opens those menus.
"""
