ids = ["hook:render_frame_pre", "hook:render_frame_post"]
why = "Version 3 fires Pre after extraction and Post after the render call, in the same order as NeoForge's RenderFrameEvent.Pre and .Post. No render call means no events. The renderer uploads texture writes from Pre before the draw; closing a screen or clearing particles in Pre takes effect on the next frame."
migrate = "Every Pre or Post listener must rebuild for the hook version bump. Move writes needed by extraction to a client tick or the relevant extraction hook. SuperCapes' native frame target needs a re-pin to an earlier engine function so cape sprite selection and slot allocation happen before extraction; cape pixel uploads still reach the same draw. SunnyOS terminal and monitor texture updates still reach the same draw for already-extracted quads, and monitor hover now reads the current frame's pick. Keep screen closing in client tick or input handling when it must take effect before extraction."
