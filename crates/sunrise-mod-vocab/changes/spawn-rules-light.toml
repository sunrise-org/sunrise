ids = ["handle:LevelRef::check_spawn_rules", "type:LightOverride"]
why = "A mod runs a mob type's spawn rules at a position with the light check overridden (#6042): SpawnPlacements.checkSpawnRules with the real light, one light level everywhere, or any level, followed by mob_spawn_placement_check so other mods' spawn checks apply. Apothic Spawners' Ignore Light modifier needs it, where Java wraps the level to report another light. A non-mob type passes its vanilla rule as SpawnPlacements.checkSpawnRules passes a type with no entry. The call draws from one copy of the level random, never written back (each Any try after the one before); the hook's level handle reads the real light; a nested call from a listener, and a call from a listener an engine pass runs while it holds the level random, are refused (Err(Unavailable)); at Peaceful a type not allowed in Peaceful answers false before its predicate and the hook."
migrate = "Additive: nothing to change."
