ids = ["hook:movement_input", "hook:movement_input_update", "method:Hooks::movement_input", "type:MovementInputEvent"]
why = "The client lends its sampled input object at NeoForge's MovementInputUpdateEvent point in vanilla LocalPlayer.aiStep, after sampling and before auto-jump and sprint. The move vector and key presses are independent, and reading the input no longer changes whether the player sprints."
migrate = "Rename Hooks::movement_input to Hooks::movement_input_update (v1) and take &mut MovementInputUpdateEvent<'_> instead of &mut MovementInputEvent. Replace event.strafe and event.forward with event.input.move_vector[0] and [1] respectively. Replace event.forward_key, backward_key, left_key and right_key with event.input.key_presses.forward, backward, left and right. Replace event.jump, sneak and sprint with the corresponding fields on event.input.key_presses. If you meant to change both movement and the reported direction, write both: neither edit updates the other. Setting sprint to false now releases the sprint key only; there is no sprint veto. Replace movement_input with movement_input_update in hook declarations."
