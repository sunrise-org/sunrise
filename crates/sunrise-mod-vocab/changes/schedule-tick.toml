ids = ["handle:LevelRef::schedule_block_tick", "handle:LevelRef::schedule_fluid_tick", "method:LevelTicksHost::schedule_block_tick_with_priority", "method:LevelTicksHost::schedule_fluid_tick_with_priority", "type:TickPriority", "handle:TickPriority::value"]
why = "A mod queues a scheduled block or fluid tick at a priority, as Java mods call ScheduledTickAccess.scheduleTick(pos, block, delay, priority), which LevelAccessor inherits: from any server hook through LevelRef (#6125), and from the in-line level writer a BlockPart's neighbor_changed or tick_block gets through LevelTicksHost, as DiodeBlock.checkTickOnNeighbor schedules at HIGH from neighborChanged (#6354). Both entry points make the same engine call into one queue with one TickPriority (net.minecraft.world.ticks.TickPriority; value() is getValue()). It is the queue update_shape's schedule_block_tick writes, saved with the chunk. A chunk's own queue runs by trigger tick, then priority, then scheduling order; across chunks there is no single order, as each chunk with a due tick competes by its next tick's priority, then scheduling order, not by trigger tick (LevelTicks.collectTicks), so ticks due on the same game tick run by priority everywhere, but an overdue Low tick in one chunk can run after a newer High tick in another. It keeps one tick per type and position, so a repeat with another delay or priority is dropped. A block tick is ignored when the block at the position has changed by the time it is due. A chunk with no tick container refuses; the height is not checked, as LevelTicks.schedule does not. Through LevelRef inside a transaction the tick is queued at commit, its delay counted from there. LevelTicksHost::schedule_block_tick and schedule_fluid_tick keep their signatures and queue at TickPriority::Normal."
migrate = "Additive: nothing to change. To schedule at a priority from neighbor_changed or tick_block, call level.schedule_block_tick_with_priority(pos, block, delay, priority) (or the fluid twin) on the host the hook gets; from other server hooks, LevelRef::schedule_block_tick(host, pos, block, delay, priority)."
