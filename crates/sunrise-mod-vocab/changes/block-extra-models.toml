ids = [
    "method:prelude::ClientRenderClientHost::set_block_extra_models",
    "type:BlockExtraModelsError",
]
why = "#2763: a client mod attaches standalone models to a block position, chosen at run time, and the chunk mesher draws them as part of that block: NeoForge's ModelData use (a cable's per-side channel counts) without a block state for each choice. ClientRenderClientHost::set_block_extra_models replaces a position's list (an empty one clears it, at most BLOCK_EXTRA_MODELS_MAX = 64) and meshes its section again when it changes. The models take the block's light and tints, each quad its own render layer, and faces with a cull direction are culled by the neighbour as the block's are. The list is client-only, kept in the client's column so the meshing workers read it and call no mod code, and cleared when the block state changes, the column unloads or the player's level changes. A section's extra models are held to its quad and byte limits after the blocks' own geometry; past them the rest, in block order then list order, are not drawn. Refusals are named (BlockExtraModelsError: NotLoaded, TooMany, Model, and Unavailable outside the World phase, which native and wasm callers both get instead of a panic or a failed call: the generator's typed phase refusals now include it). New method and types only; no existing wire layout changes."
migrate = "Additive. Resolve the models with RenderAssets::model in client_setup and client_resources_reloaded; the setter is World-only, so set a position's list again from the next World-phase callback after a reload (client_tick_pre) and when its block changes."
