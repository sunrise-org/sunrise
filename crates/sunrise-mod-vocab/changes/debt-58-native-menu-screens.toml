why = "A client window constructs and owns one screen and its callbacks per menu opening. The server owns slot exclusions, recipe destinations and packet validation; it no longer runs a screen factory or interprets screen geometry."
migrate = """
In Hooks::register, replace MenuPart::screen and its ScreenEvent with r.register_menu_screen(menu, Arc::new(|host: &dyn ClientHost, open: MenuScreenOpen<'_>| -> Option<MenuScreen> { ... })). Replace Screen { ... } (including Screen::default()) with MenuScreenLayout { ... } (or MenuScreenLayout::default()), and return Some(MenuScreen::new(layout)) after adding the callbacks below. Remove any MenuPart used only for presentation. A custom menu needs its owner's factory to show a screen, not to load. For a stock menu such as minecraft:hopper, the factory runs only for a verified mod opener owned by the registering mod; select your block with open.block. Returning None from the selected factory refuses the opening. MenuScreenLayout, ScreenSlot, RecipeBookToggle and ToggleOrigin are client presentation, not Wire types: build them inside the factory instead of encoding them as payloads.

- MenuPart::screen_draw(host, event) -> .with_draw(move |host, frame, draw| { ... }); use draw instead of event.draw.
- MenuPart::screen_click(host, event) -> .with_click(move |host, frame, right| { ... }); use right instead of event.right. Return Some(button_id) to consume the press and request the button on the server, or None to pass it on. Keep menu_button_valid, menu_button and menu_still_valid on the MenuPart; a client hit is not server acceptance.
- MenuPart::screen_tooltip(host, event) -> .with_tooltip(move |host, frame, slot, lines| { ... }); use slot and lines instead of event.slot and event.lines. Modify the rich (Text, color) lines in place.
- In each callback, read event.origin, event.pointer, event.gui_size, event.at and event.data as frame.origin, frame.pointer, frame.gui_size, frame.at and frame.data wherever the old event had them. For event.menu, event.block or event.pos, read open.menu, open.block or open.pos while building the screen and capture any needed owned values. host.screen_pos() still reads the shown opening's position.
- Replace host.screen_extra_data() with open.extra in the factory. No matching payload means an empty slice. Decode opening context there and move owned results into the callbacks; read live updates with frame.data.get(index), not the opening bytes. Block-backed menu data still carries signed shorts, and blockless mod menu data carries i32. Closing or replacing a screen drops its callbacks and local state, even when the server reuses its window ID.

Replace r.menu_recipe_book(menu, &book, recipe_type, roles, screen) with r.menu_recipe_book(menu, &book, recipe_type, roles) plus r.register_menu_screen(menu, factory) from the same mod. In that factory, return Some(MenuScreen::new(layout)) with layout.recipe_book = Some(book.clone()), the former geometry and any toggle anchor or big-result setting. Drop RecipeBookLayout::validate_screen(&screen): use roles.validate(backing_slots) and roles.validate_exclusions(excluded) to check role indices and masks if you validate your own declarations. The game checks the roles at content load and the geometry at open.

For each old permanent None entry or omitted trailing hole, register its original backing index with r.menu_slot_exclusions(menu, opener, &[indices]) in Hooks::register. For your own content menu use None for its default or Some(block_id) for a specific opener's replacement mask; for a stock menu use Some(your_block_id). An empty slice explicitly overrides a default with no exclusions. Keep the holes in the layout (trailing exclusions may still be omitted); never compact the indices. Give every other backing slot finite geometry, including every recipe role, and use positive finite panel dimensions. A mask outside actual storage refuses the open, and a layout that disagrees with the mask refuses the client window.

For a temporary hide, give that slot geometry in the factory and call host.set_screen_slot(menu, index, None) after the screen is shown. Restore it with Some([x, y]); only the screen's factory owner can move or hide it for that opening. A local hide does not change the server's slot rules, recipe destinations or quick-move. A permanent exclusion keeps its index but cannot be shown (HiddenAtOpen); NoSuchSlot means the index is outside the actual backing.
"""
