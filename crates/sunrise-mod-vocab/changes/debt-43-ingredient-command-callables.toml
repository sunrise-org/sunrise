why = "Custom ingredients and server commands now register their behavior together with their data. Ingredient matching borrows the live stack and command execution uses the node from the current server dispatcher. Both invoke only the owning mod; recipe JSON and synced display data contain no native code."
migrate = """
Implement `fn ingredient(&self, context: &dyn DataLoadContext, event: &mut IngredientEvent<'_>) -> Option<IngredientDefinition>`. Return `None` for an unhandled `event.kind`. For your kind, parse `event.data` once and replace writes to `event.items` with `Some(IngredientDefinition::new(items, move |context, stack| ...))`, where `items` is an ordered `Vec<String>` of candidate item IDs. Delete `Hooks::ingredient_test`. Move its test into that closure and capture the parsed data; return `false` where you used to set `event.accept = false` and `true` to accept. The first enabled mod to return `Some` claims the occurrence. `Some` with no candidates allows manual matching but not placement; `None` from every mod refuses the recipe. A disabled owner rejects stacks without another dispatch.

Read the borrowed `IngredientStack` with `item_id()` or `item_key()` instead of the old stack's `item()`, `count()` for the count, and `damage()` for optional damage (including `Some(0)`). Replace reads of an owned component patch with `stored_component(id)` for borrowed stored NBT, `has_component(id)` for effective presence, or `component_removed(id)` for an explicit removal. Do not write candidate IDs into recipe JSON. `Ingredient.custom` is now an opaque bound predicate, not a `(kind, data)` tuple. To check the full resolved ingredient, call `Ingredient::test(host, stack)` as before; it applies candidate filtering before calling the predicate. Placement still rechecks live stacks on the server.

Remove `Ingredient`, `Recipe`, `RecipeRule`, `FireworkShapeIngredient`, `PlacementInfo`, `RecipeBookCategory` and `RecipeBookDisplayEntry` from `Wire` payloads and from fields of `Wire` types. Keep those values in-process. For a remote viewer send a separate data-only record deriving `Wire` with the recipe ID, candidate item IDs or `RecipeBookDisplay` values it needs; do not use the display list as an authoritative match.

In `Hooks::register_commands`, change `event.commands.push(Command::new(usage))` to `event.commands.push(Command::new(usage).executes(callback))`, or use `Command::op(usage, level).executes(callback)` to keep an operator level. Delete `Hooks::run_mod_command`; move each usage's branch into its own executor `|host, source, command| { ... }`. Use the borrowed `source` and `command` in place of `event.source` and `event.command`, and remove literal checks used only to route the old hook. Capture owned or shared state in a `move` closure. Return `Some(1)` in place of `Flow::Cancel` or `event.cancelled = true` for success (or `Some(n)` for a specific result, including zero). Return `None` in place of `Flow::Continue` for failure, not to pass control to another mod. Delete any `receive_cancelled` listener for this hook; an executor is not a broadcast event. If usages execute at the same node, including at optional prefixes, the lowest operator level wins; the first registration at that level wins on ties. Failure or a disabled owner never tries another executor. Register the complete set on every `register_commands` call. Client command registration is unchanged.
"""
