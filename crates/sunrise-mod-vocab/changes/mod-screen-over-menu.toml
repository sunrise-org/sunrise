ids = ["method:prelude::ScreensClientHost::mod_screen_open_over_menu", "method:prelude::ScreensClientHost::mod_screen_close", "method:prelude::ScreensClientHost::close_screen"]
why = "Adds ClientHost::mod_screen_open_over_menu(mod_id) (#4264): a mod's own screen opened over the open menu's container screen while the menu stays open, vanilla's Minecraft.setScreen(new Screen(..)) with player.containerMenu untouched, as AE2's sub-screens (priority, amounts, terminal settings) open. The menu keeps syncing and its slots and carried stack stay; Escape, close_screen and mod_screen_close return to the same container screen with nothing sent (setScreen(parent)). The server closing the menu closes the screen with it; another screen replacing it ends the menu as it ends a replaced container screen. The container screen is covered as NeoForge's pushScreenLayer covers a screen, not replaced as Gui.setScreen replaces one: no screen_closing for it and no removed(); its mounted widgets and the gamepad's focus go while it is covered and its screen_init_post runs again on return, with no focus carried over. screen_opening fires for the sub-screen, ScreenView.slots is 0 for it, and a screen_opening Vanilla answer opens that screen in place of the container screen and closes the menu as mod_screen_open's redirect does. One level deep, a second call replaces the sub-screen."
migrate = "Nothing to migrate: mod_screen_open still closes a container screen it replaces. A mod that drew a dialog inside its container screen with screen hooks and hidden slots can open it as its own screen with mod_screen_open_over_menu and return with mod_screen_close."
