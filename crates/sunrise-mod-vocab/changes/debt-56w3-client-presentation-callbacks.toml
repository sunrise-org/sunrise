why = "The client calls the HUD, F3 and loading-screen code installed by the registering mod instead of broadcasting draw IDs. HUD slots can be wrapped or replaced in place, and a canceled Pre no longer fires Post. F3 text stays registered for the client session. NeoForge's RegisterDebugEntriesEvent runs at startup, and RegisterDebugRenderersEvent follows vanilla's DebugRenderer.refreshRendererList, including refreshes after DebugScreenEntryList.rebuildCurrentList leaves the selection unchanged. A loading screen keeps one presentation until it closes. A new login or death screen does not look up a dimension-keyed factory."
migrate = """
HUD — In `Hooks::register_gui_layers`, replace `event.layers.push(GuiLayer { id, placement })` with `event.layers.register(id, placement, Box::new(move |host, draw| { /* draw this layer */ }))`. `RegisterGuiLayersEvent.layers` is now a `&mut dyn GuiLayerRegistrar`, not a vector. Keep the ID and `GuiLayerPlacement`. Move the matching `Hooks::gui_layer_draw` branch into the callback: `host` is the current `ClientHost` and `draw` replaces `event.draw`. Capture per-layer data instead of branching on `event.layer`. Remove the `GuiLayer` and `GuiLayerDrawEvent` imports and the old draw method. `register` returns `false` if the ID or relative anchor is rejected. To place a layer between the player health rows and the contextual bar, use `Above("minecraft:player_health".into())` or `Below("minecraft:contextual_info_bar".into())`.

If your `gui_layer_pre` branch drew a replacement and returned `Flow::Cancel`, move that paint into `event.layers.replace_layer(id, Box::new(|host, draw| { /* replacement */ }))` at registration. To keep or conditionally call the previous body instead, use `event.layers.wrap_layer(id, Box::new(|ctx| { /* paint around ctx.draw_previous() */ }))`. Within the wrapper, read the client with `ctx.host()`, draw with `ctx.with_draw(&mut |draw| { /* before or after paint */ })`, and call `ctx.draw_previous()` at the point where the previous body should paint. Omit that call to skip its paint for this frame. Both methods keep the original slot's ID, order and draw conditions, and return `false` for an unknown ID. Use Pre for vetoing an entire slot, not replacing its body. `gui_layer_post` keeps its signature but does not follow a canceled Pre. Keep layer-specific after-paint work in Post or the wrapper; move independent after-HUD work to `gui_render_post`, even when the original slot was canceled or F1 hid it.

F3 text — In `Hooks::register_debug_entries`, replace `event.entries.push(DebugEntry { id, group })` with `event.entries.push(DebugEntry::text(id, group, move |host, lines| { /* append lines */ }))`. Move the matching `Hooks::debug_entry_lines` branch into this callback. Read the client through `host` and append to `lines` instead of `event.lines`; there is no `event.id` to match. Remove the old hook and `DebugEntryLinesEvent` import. Replace `DebugEntry { id, group: DebugGroup::Renderer }` with `DebugEntry::renderer(id)`. Use `entry.id()` instead of `entry.id`, and `entry.text_lines()` instead of `entry.group`: it returns the text group and callback, or `None` for a renderer switch. Registration still takes `RegisterDebugEntriesEvent`, but the batch starts empty for each mod. If you previously encoded `DebugGroup::Renderer`, store a renderer flag of your own instead; `DebugGroup` now contains only text groups.

F3 renderers — Keep declaring `DebugEntry::renderer(id)` at startup. On every `Hooks::register_debug_renderers` refresh, replace `event.renderers.push(DebugRenderer { id })` with `event.renderers.push(DebugRenderer::new(id, move |host, view, draw| { /* draw this renderer */ }))`, using the same switch ID. Move the matching `Hooks::debug_renderer_draw` branch into the callback. Read the client through `host`; `view` and `draw` replace `event.view` and `event.draw`. Capture renderer-specific data rather than branching on `event.id`. Remove the old hook and `DebugRendererDrawEvent` import; use `renderer.id()` in place of the field read. `RegisterDebugRenderersEvent` still takes a vector of renderers, now empty for each registering mod. Push all your renderers on each refresh, even when the enabled toggles haven't changed: the client selects which callbacks to keep from the current toggles.

Loading screens — In `Hooks::register_dimension_transition_screen`, replace `event.screens.push(DimensionTransitionScreen { screen, transition })` with `event.screens.push(DimensionTransitionScreen::new(screen, transition, move |host, initial_reason| { /* return a boxed presentation */ }))`. Keep the transition key and use `registration.screen()` and `registration.transition()` in place of field reads. The batch in `RegisterDimensionTransitionScreenEvent` now starts empty for each mod. Move the matching `Hooks::dimension_transition_screen_draw` branch into the presentation's `draw` method, or return `Box::new(move |host: &dyn ClientHost, reason, progress, draw: &mut dyn DrawContext| { /* draw the screen */ })` from the factory. Draw with the current host, reason, progress and draw context instead of the old event; there is no `event.screen` to match. Remove the old draw hook and `DimensionTransitionScreenDrawEvent` import. Set up per-load state in the factory and capture it in the returned `DimensionTransitionPresentation`. A factory is called once when a matching trip opens a new screen. If the screen is updated in place, the same instance draws with the new reason and progress. A new login or death screen uses vanilla, not a keyed registration; an already open loading screen keeps its presentation.

`GuiLayer` is gone. `DebugEntry`, `DebugRenderer` and `DimensionTransitionScreen` now own callbacks and no longer implement `Wire`, `Clone`, `Debug`, `PartialEq` or `Eq`. Store IDs, text groups, placements and transition keys in your own data, construct declarations with local functions when registering, and compare or log their IDs or keys instead of the declarations. The four registration hooks and `gui_layer_post` move from version 1 to 2; `gui_layer_pre` stays at version 1.
"""
