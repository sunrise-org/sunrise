ids = ["method:PieceContext::set_block_raw"]
why = "A structure piece can write a block the way `WorldGenLevel.setBlock` does, without `StructurePiece.placeBlock`'s extras (#6037). `PieceContext::set_block_raw(pos, state)` writes with flags 2 and is clipped to `chunk_box` like `set_block`, but skips the two extras of `StructurePiece.placeBlock`: it schedules no fluid tick for a fluid at `pos`, so water or lava a piece places stays still until something else ticks it, and it makes no piece-level mark of a shape-check block (torch, fence, ladder, iron bars) for post-processing. The level still applies the block state's own post-processing rule for flags 2 (soul sand still marks the position above it), and the call doesn't cancel a queued tick. Applied Energistics 2's meteorite crater writes through the level this way."
migrate = "Additive: nothing to change. A type that implements `PieceContext` itself (the game is its only implementor) adds `set_block_raw`."
