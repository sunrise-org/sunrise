ids = ["type:NameTagOptions.scale", "handle:NameTagOptions::with_scale", "handle:NameTagOptions::NAME_TAG_SCALE", "type:DrawError.InvalidScale"]
why = "A mod's world label can be drawn larger or smaller than a name tag: NameTagOptions::scale is the world size of one text pixel (PoseStack.scale(s, -s, s), a name tag's 0.025 by default, NameTagOptions::NAME_TAG_SCALE), the label still 0.5 above its anchor and the backdrop's gap behind the text scaled with it. A scale that is not finite, zero or negative refuses the label with DrawError::InvalidScale, and one so large the text positions overflow f32 with DrawError::NonFinite (#6143, Sunny Lyrics' world text sizes)."
migrate = "Nothing to migrate: NameTagOptions::new and Default give 0.025, the size labels had. NameTagOptions keeps PartialEq and Eq (the scale compares by its bits). A match on DrawError without a wildcard arm adds InvalidScale."
