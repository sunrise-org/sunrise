ids = ["hook:entity_tick_pre", "hook:entity_tick_post"]
why = "Version 6 tells a client the tick of every entity it ticks (ClientLevel.tickNonPassenger and tickPassenger, with NeoForge's Entity.rideTick patch), each alone around its own tick: the local player (besides player_tick_pre and player_tick_post, as NeoForge posts EntityTickEvent for it too), items, experience orbs, primed TNT, falling blocks, rockets, boats, minecarts, a vehicle this client drives (before the local player), armor stands, general entity rows and the other tracked entities, under the same event signature. On a frozen client level only the players and what carries them are told. A passenger counts its Entity.commonTick before its Pre and its vehicle still positions it when that Pre cancels."
migrate = "Rebuild against this SDK. A listener on a client now also hears these entities and the local player, not only mobs, other players, projectiles, tridents and displays. Filter by event.kind or entity id when only some are wanted; a listener that cancels by kind should check event.kind before returning Flow::Cancel."
