ids = ["handle:LevelRef::datapack_read", "fn:data_map_value", "fn:data_map_entries"]
why = "Datapack visitors borrow entries from a pinned generation without holding a registry lock. Raw data-map reads borrow published tags and sorted rows instead of cloning them at each lookup. Typed key reads still return owned decoded values."
migrate = "Replace level.datapack_read(host, &handle)? with level.datapack_read(host, &handle, &mut |entry| { /* read entry.values or entry.get(...) */ })?. Read or copy fields inside the visitor; keep IDs to resolve a fresh handle after reload. data_map_value(host, registry, entry, map)? now returns Option<&Tag>; use .cloned() only to retain an owned tag. data_map_entries(host, registry, map)? now returns a slice sorted by entry ID; iterate by reference, or call .to_vec() explicitly to retain all rows. The raw reads borrow from host, not the lookup IDs. For typed keys such as ItemKey, key.data(host, &map) still returns an owned decoded value and needs no change."
