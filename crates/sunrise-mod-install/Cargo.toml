[package]
name = "sunrise-mod-install"
description = "Shared registry mod planning and transactional installation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sunrise-mod-package = { path = "../sunrise-mod-package", default-features = false, features = ["index"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
toml = "1.1"
toml_edit = "0.25"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[lints]
workspace = true
