name: wasm-mods
# The daily run and manual dispatch only, never pull requests or main pushes (owner, 2026-11-12; CI tiers 2026-11-13).
on:
  # The daily run (daily.yml) calls it with the commit to check; root dispatches it on a branch that changes
  # what it builds.
  workflow_call:
    inputs:
      commit:
        description: The commit to check (the daily run's)
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
# A daily run's call is grouped by that run and always finishes (daily.yml runs one at a time). A dispatch on main
# gets a group of its own; elsewhere a newer dispatch on the same branch replaces the one before, which checked a
# superseded head.
concurrency:
  group: wasm-mods-${{ inputs.commit && github.run_id || github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ inputs.commit == '' && github.ref != 'refs/heads/main' }}
jobs:
  fixture:
    runs-on: dyna-large
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: Configure persistent build targets
        shell: bash
        run: |
          # Dyna supplies a persistent target mount.
          target="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/target}"
          mkdir -p "$target"
          if [[ "$target" != "$GITHUB_WORKSPACE/target" ]]; then
            ln -s "$target" "$GITHUB_WORKSPACE/target"
          fi
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          # build-std fingerprints rust-src mtimes, including its build scripts.
          # Keep the toolchain beside its artifacts across ephemeral runners.
          echo "RUSTUP_HOME=$target/rustup" >> "$GITHUB_ENV"
          cache="$target/wasm-fixtures"
          # Keep generated workspaces real: Cargo cannot discover their members
          # through a target symlink. Each member still has its own workspace and
          # link invocation. Dispatches on other branches reuse dependency artifacts; main also exercises
          # independent dependency compilation in the original per-member targets.
          for member in fixture minimal_mod mixed-output-fixture library-fixture/{library,observer,dependent} groups/{counter_lib,alpha,beta,gamma,hog}; do
            root="$GITHUB_WORKSPACE/crates/sunrise-mod-wasm/tests/$member/target/sunrise-mod"
            mkdir -p "$root"
            artifacts="$cache/shared"
            if [[ "$GITHUB_REF" == refs/heads/main ]]; then
              artifacts="$cache/$member"
            fi
            for artifact in sunrise-wasm wasm32-unknown-unknown std-artifacts; do
              mkdir -p "$artifacts/$artifact"
              ln -s "$artifacts/$artifact" "$root/$artifact"
            done
          done
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: rust-src, rustfmt
          targets: wasm32-unknown-unknown
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      # The host-side tests below run from one build of the workspace's tests, verify's own command: one feature
      # resolution for every package (the workspace's: sunrise-mod-wasm's listener-fixture, sunrise-mod-api's
      # wasm-guest, ... are all on in it) and the host compiler cache verify fills. Each `cargo test -p PACKAGE
      # --features ...` resolved its own variant of the shared crates and compiled it again, and the job ran past its
      # 120 minutes in daily 44065326913 (#2288). `ignored_tests.py --prebuilt` runs a target's executable as
      # `cargo test` would; mixed-output-fixture (never in the workspace) and the release bench still build their own.
      - name: Build the workspace's tests once
        continue-on-error: true  # a target it could not build fails where its tests run, by name
        run: |
          echo "WORKSPACE_TESTS=$RUNNER_TEMP/workspace-tests.json" >> "$GITHUB_ENV"
          python3 tools/ci/ignored_tests.py --build-tests "$RUNNER_TEMP/workspace-tests.json"
      - name: Check fieldless Wire layout coverage and hashes
        shell: bash
        run: |
          python3 -m unittest tests.test_wire_enum_goldens
          mkdir -p "$CARGO_TARGET_DIR/wire-goldens"
          env -u RUSTC_WRAPPER RUSTC_BOOTSTRAP=1 cargo rustc --locked -p sunrise-mod-vocab --lib -- \
            -Zunpretty=expanded > "$CARGO_TARGET_DIR/wire-goldens/expanded.rs"
          python3 tools/generate_wire_enum_goldens.py \
            --expanded "$CARGO_TARGET_DIR/wire-goldens/expanded.rs" --check
          python3 tools/ci/ignored_tests.py --prebuilt "$WORKSPACE_TESTS" -p sunrise-mod-vocab --lib -- existing_fieldless_enum_layouts_match_baseline
          python3 tools/ci/ignored_tests.py --prebuilt "$WORKSPACE_TESTS" -p sunrise-mod-api --test wire_math_profile
      - name: Compile and test emitted point records
        run: |
          manifest=crates/sunrise-mod-point-shape/tests/record-wire/Cargo.toml
          cargo test --manifest-path "$manifest" --features wasm-guest --locked
          cargo check --manifest-path "$manifest" --features wasm-guest --target wasm32-unknown-unknown --locked
      - name: Build tool and shared member
        id: fixture
        run: |
          cargo build -p cargo-sunrise-mod
          cd crates/sunrise-mod-wasm/tests/fixture
          "$GITHUB_WORKSPACE/target/debug/cargo-sunrise-mod" sunrise-mod build --wasm --catalog points.json
          (cd ../minimal_mod && "$GITHUB_WORKSPACE/target/debug/cargo-sunrise-mod" sunrise-mod build --wasm --catalog ../fixture/points.json)
          "$GITHUB_WORKSPACE/target/debug/cargo-sunrise-mod" sunrise-mod wasm-std "$GITHUB_WORKSPACE/target/sunrise-wasm-std.wasm" --catalog points.json
      # Each group of the fixture's tests below runs once the fixture is built, whatever an earlier group's result: a
      # failure in one hides no other (the daily files each by name).
      - name: Validate and load the fixture
        env:
          SUNRISE_WASM_FIXTURE: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/fixture/target/sunrise-mod/wasm_fixture.smod
          SUNRISE_WASM_MINIMAL_MOD: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/minimal_mod/target/sunrise-mod/minimal_mod.smod
          SUNRISE_WASM_STD: ${{ github.workspace }}/target/sunrise-wasm-std.wasm
        shell: bash
        run: |
          # Every command runs, and each test's verdict goes into the job's daily report (tools/ci/cargo_test_verdict.py),
          # so the daily summary files a failure here by test name; the step fails after them if any failed.
          failed=0
          verdict() { python3 tools/ci/cargo_test_verdict.py "$RUNNER_TEMP/daily-report-own.json" -- "$@" || failed=1; }
          prebuilt() { verdict python3 tools/ci/ignored_tests.py --prebuilt "$WORKSPACE_TESTS" "$@"; }
          prebuilt -p sunrise-mod-api --lib -- guest_pool_
          prebuilt -p sunrise-mod-api --lib -- phase_tests
          prebuilt -p sunrise-mod-vocab --lib -- strict_math_seeded_reference_vectors_match_exact_bits
          prebuilt -p sunrise-mod-wasm --test strict_math -- --ignored --nocapture
          prebuilt -p sunrise-mod-points --test registry --test replace --test order
          prebuilt -p sunrise-mod-wasm --test real_member --test unstaged --test self_refusal --test native_listener --test no_wire_registration --test capability_registration --test chunk_disk --test import_identity -- --include-ignored --nocapture --skip a_mod_built_before_the_break
          prebuilt -p sunrise-mod-wasm --lib -- guest_input_pool_stays_flat_for_100k_no_import_calls --ignored --nocapture
          exit "$failed"
      - name: Build and test the isolated mixed-output boundary
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        env:
          SUNRISE_WASM_MIXED_OUTPUT_FIXTURE: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/mixed-output-fixture/target/sunrise-mod/mixed_output_fixture.smod
          SUNRISE_WASM_STD: ${{ github.workspace }}/target/sunrise-wasm-std.wasm
        run: |
          (cd crates/sunrise-mod-wasm/tests/mixed-output-fixture && \
            "$GITHUB_WORKSPACE/target/debug/cargo-sunrise-mod" sunrise-mod build --wasm --catalog ../library-fixture/points.json)
          cargo test -p sunrise-mod-wasm --features mixed-output-fixture --test listener_outputs -- --ignored --exact generated_mixed_outputs_cross_real_guest_boundary --nocapture
      # The client tests that load this run's compiled fixture into a real game. The slow shards refuse them by
      # name (`needs` rows in tools/ci/ignored-tests/wasm-fixture.txt): only this job has the artifacts.
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare checkout-keyed vanilla data
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: |
          for dir in minecraft datagen sunrise-client tools; do
            if [ ! -d "/cache/sunrise-local/$dir" ]; then
              echo "::error::prepared data unavailable on this runner: $dir"
              exit 1
            fi
          done
          SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
      - name: Run the client tests that load the compiled fixture
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        shell: bash
        env:
          SUNRISE_WASM_FIXTURE: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/fixture/target/sunrise-mod/wasm_fixture.smod
          SUNRISE_WASM_STD: ${{ github.workspace }}/target/sunrise-wasm-std.wasm
          SUNRISE_NO_AUDIO: '1'
          SUNRISE_LAUNCHER_NO_SELF_UPDATE: '1'
        run: |
          set -euo pipefail
          export SUNRISE_TEST_RESOURCES="$PWD/.local/sunrise-client/26.3"
          # The runner's CPU quota within its memory (as verify): sunrise-client rustc processes take ~2.6 GB each.
          jobs="$(python3 tools/ci/cargo_jobs.py --job-mib 3072)"
          # Fresh homes: the game tests write logs and saves there, never into the runner's own folders.
          for key in SUNRISE_HOME SUNRISE_LAUNCHER_HOME XDG_DATA_HOME XDG_CONFIG_HOME; do
            export "$key=$(mktemp -d "$RUNNER_TEMP/${key,,}.XXXXXX")"
          done
          # Each alone in its process: each initializes the fixture mod, and the points table is sealed once per
          # process, so a second initialization there refuses the fixture's replace listener as already owned.
          # The tests are the `needs SUNRISE_WASM_FIXTURE` rows and the `daily ... wasm-fixture` rows (no shard has the
          # fixture); each run must report exactly one test passed.
          python3 tools/ci/ignored_tests.py --needs SUNRISE_WASM_FIXTURE --one-process-each --jobs "$jobs" \
            --binaries "$WORKSPACE_TESTS" --report "$RUNNER_TEMP/daily-report.json"
      # The tests' names and verdicts for the daily summary (cargo_test_verdict.py and ignored_tests.py --report); no
      # test output.
      - name: Upload the fixture tests' report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-fixture
          path: |
            ${{ runner.temp }}/daily-report.json
            ${{ runner.temp }}/daily-report-own.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Build independent library members
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: |
          tool="$GITHUB_WORKSPACE/target/debug/cargo-sunrise-mod"
          root="$GITHUB_WORKSPACE/crates/sunrise-mod-wasm/tests/library-fixture"
          for member in library observer dependent; do
            (cd "$root/$member" && "$tool" sunrise-mod build --wasm --catalog "$root/points.json")
          done
      - name: Load independently built library members
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        env:
          SUNRISE_WASM_STD: ${{ github.workspace }}/target/sunrise-wasm-std.wasm
          SUNRISE_WASM_LIBRARY: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/library-fixture/library/target/sunrise-mod/wasm_test_library.smod
          SUNRISE_WASM_OBSERVER: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/library-fixture/observer/target/sunrise-mod/wasm_test_observer.smod
          SUNRISE_WASM_DEPENDENT: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/library-fixture/dependent/target/sunrise-mod/wasm_test_dependent.smod
        run: python3 tools/ci/ignored_tests.py --prebuilt "$WORKSPACE_TESTS" -p sunrise-mod-wasm --test real_library -- --nocapture
      - name: Build the same-group capability members
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        run: |
          tool="$GITHUB_WORKSPACE/target/debug/cargo-sunrise-mod"
          groups="$GITHUB_WORKSPACE/crates/sunrise-mod-wasm/tests/groups"
          catalog="$GITHUB_WORKSPACE/crates/sunrise-mod-wasm/tests/library-fixture/points.json"
          for member in counter_lib alpha beta gamma hog; do
            (cd "$groups/$member" && "$tool" sunrise-mod build --wasm --catalog "$catalog")
          done
      - name: Load the group members
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        env:
          SUNRISE_WASM_STD: ${{ github.workspace }}/target/sunrise-wasm-std.wasm
          SUNRISE_WASM_GROUPS: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/groups
        run: python3 tools/ci/ignored_tests.py --prebuilt "$WORKSPACE_TESTS" -p sunrise-mod-wasm --test groups -- --nocapture
      # A hand dispatch only: the daily run (a call with its commit) does not measure.
      - name: Measure block entity boundary
        if: github.event_name == 'workflow_dispatch' && inputs.commit == ''
        env:
          SUNRISE_WASM_FIXTURE: ${{ github.workspace }}/crates/sunrise-mod-wasm/tests/fixture/target/sunrise-mod/wasm_fixture.smod
          SUNRISE_WASM_STD: ${{ github.workspace }}/target/sunrise-wasm-std.wasm
        run: cargo test --release -p sunrise-mod-wasm --features listener-fixture --test bench block_entity_ticks -- --ignored --nocapture

  guest-stack:
    name: Guest stack / ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - name: The pinned Rust (tools/ci/rust-version)
        id: rust
        shell: bash
        run: echo "version=$(cat "$GITHUB_WORKSPACE/tools/ci/rust-version")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - run: cargo test --locked -p sunrise-guest-stack --lib
      - run: cargo test --locked -p sunrise-mod-wasm --lib deep_guest_stack_and_overflow_attribution
      - run: cargo test --locked -p sunrise-mod-wasm --lib sixty_thousand_frames_exceed_wasmtime_default
      - run: cargo test --locked -p sunrise-mod-wasm --lib generated_client_and_server_hooks_complete_sixty_thousand_frames
      - run: cargo test --locked -p sunrise-mod-wasm --features runtime-fixture --test main_stack_probe -- --nocapture
