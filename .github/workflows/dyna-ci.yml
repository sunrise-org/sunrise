name: dyna-checks
# What the run tests, readable in the run list: a dispatch with `pr` runs on ref main but tests that pull request's head,
# so it is named for it and never read as main's CI; the prepared-output dispatch likewise.
run-name: "${{ inputs.pr && format('PR #{0} gate', inputs.pr) || inputs.prepare-output-check && 'prepared output check' || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}"
# A contributor's pull request (its head in a fork) gets the cheap checks (verify-static, format); the heavy ones
# (everything that compiles) run on main's pushes, dispatches, and same-repository rollup or sync pull requests
# (tools/ci/pr_gate.py, docs/ci-runners.md).
# Keep upstream's workflows byte-identical; disable checks (ci.yml) in the fork's Actions
# settings after this workflow's verify passes on main.
# Scheduled events run only the hosted dispatcher and the churn report; the dispatched run uses Dyna.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      github-fallback:
        description: Force GitHub-hosted runners after a boat runner outage
        type: boolean
        default: false
      prepare-output-check:
        description: Check the prepared output digest
        type: boolean
        default: false
      pr:
        description: Run the heavy checks on this pull request's head (a fork's too) and post them on it
        type: string
        default: ''
defaults:
  run:
    shell: bash

permissions:
  contents: read
concurrency:
  # A new push to a pull request replaces its running checks, and a new push to main replaces main's: only the newest
  # main head needs a gate, and a burst of merges otherwise held a Dyna runner per job of every merge's run, ahead
  # of the rollup gates queued behind them. None of its jobs publishes or writes shared state.
  # A dispatch for a pull request (`pr`) is grouped by that pull request, never by main's head; any other dispatch
  # (a snapshot's gate) by its commit, and it always finishes.
  # A main push run started again (a later attempt) is a release's gate: release.yml re-runs a commit's gate that the
  # next push cancelled before it publishes that commit (tools/release_train.py gate_again). It is grouped by its
  # commit and always finishes.
  group: dyna-checks-${{ github.event.pull_request.number || inputs.pr && format('pr-{0}', inputs.pr) || github.event_name == 'push' && github.run_attempt == '1' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' && github.run_attempt == '1' }}
env:
  # Test runs never reach the telemetry server: no live-count ping, no uploads (docs/telemetry.md).
  SUNRISE_TELEMETRY_URL: "off"
  # sccache (shared per Dyna host) cannot cache incremental compiles, so every Rust job builds non-incremental.
  CARGO_INCREMENTAL: 0
jobs:
  # Dyna runners accept dispatches, not scheduled events.
  nightly-dispatch:
    if: github.repository == 'sunrise-org/sunrise' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dyna-ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Dyna's image enforces the event and repository check again in job-started.sh.
  # GitHub's external-contributor approval is the third lock.
  # A draft pull request skips every check below (they all need this job); it runs when marked ready.
  changes:
    if: github.event_name != 'schedule' && !inputs.prepare-output-check && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # The shared pool (sunrise-pool: Dyna's runners and ARC on hw-0) for a gate (main, dispatches, this repository's rollups and syncs: the pull requests
    # pr_gate.py marks heavy, and checks in ci.yml skips) while the repository's switch is on, so the gate never queues
    # on GitHub's runners. Every other pull request runs this workflow on GitHub's runners, beside checks: nothing
    # gates on it, and Dyna's runners are counted (16 on the host), so they are kept for the gates. A forced fallback
    # stays on GitHub's. The routing below still reads the lease.
    runs-on: >-
      ${{ vars.DYNA_CI_SELF_HOSTED == 'true' && !inputs.github-fallback && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository && (
      startsWith(github.head_ref, 'sunrise-review-rollup-') || startsWith(github.head_ref, 'fork-review-rollup-') ||
      startsWith(github.head_ref, 'rollup-') || startsWith(github.head_ref, 'sync-') ||
      contains(github.event.pull_request.labels.*.name, 'rollup') || contains(github.event.pull_request.labels.*.name, 'sync'))) &&
      'sunrise-pool' || 'ubuntu-latest' }}
    # Selection normally finishes in two minutes; allow two bounded history fetches.
    timeout-minutes: 13
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      # Whether the heavy jobs run (tools/ci/pr_gate.py); a dispatch with `pr` runs them on that head.
      heavy: ${{ steps.gate.outputs.heavy }}
      pr_sha: ${{ steps.gate.outputs.pr_sha }}
      # Whether this run's code may use our own runners: never a fork's pull request, dispatched or not.
      trusted: ${{ steps.gate.outputs.trusted || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false') }}
      rust_required: ${{ steps.selection.outputs.rust_required || 'true' }}
      launcher_required: ${{ steps.selection.outputs.launcher_required || 'true' }}
      tooling_required: ${{ steps.selection.outputs.tooling_required || 'true' }}
      # Only a gate (heavy) uses Dyna's runners; a pull request outside it runs where a pool-down run would.
      self_hosted: ${{ steps.gate.outputs.heavy == 'true' && !inputs.github-fallback && steps.hosted.outputs.forced_github != 'true' && steps.runner.outputs.self_hosted || 'false' }}
      # Where lint and verify run when they don't go to Dyna's pool: boat-large for listed outside contributors
      # while vars.BOAT_CI is on (boat refuses a public repository's run unless both its author and the user who
      # started it are on boat's own list, so the same list lives in vars.BOAT_CI_USERS), else GitHub's runner.
      hosted_label: ${{ steps.hosted.outputs.label }}
      forced_github: ${{ steps.hosted.outputs.forced_github }}
    steps:
      - uses: actions/checkout@v4
      # Dyna's runner image has no GitHub CLI; GitHub's runners do.
      - name: GitHub CLI
        run: bash tools/ci/ensure_gh.sh
      - name: Heavy checks for this event
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR: ${{ inputs.pr }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 tools/ci/pr_gate.py >> "$GITHUB_OUTPUT"
      - name: Fetch this commit's history for selection
        if: github.event_name == 'pull_request'
        timeout-minutes: 11
        env:
          FETCH_STEP: Fetch this commit's history for selection
        # On our runners the slot's history mirror makes this a short fetch (tools/ci/history_fetch.sh).
        run: bash tools/ci/history_fetch.sh
      - name: Select checks once for this pull request
        if: github.event_name == 'pull_request'
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/rust_changes.py --all "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # workflow_run omits pull_requests for fork runs. Record only immutable IDs;
      # the trusted controller reads this as bounded data, never as executable code.
      - name: Record the original PR base for boat recovery
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        run: |
          python3 -I - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          Path('boat-base.json').write_text(json.dumps({
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': '1',
              'base': event['pull_request']['base']['sha'],
              'head': event['pull_request']['head']['sha'],
          }))
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          name: boat-base-1
          path: boat-base.json
          retention-days: 2
      # The pool's switch and lease (tools/ci/dyna_ci_route.sh): live when readable, else the run's snapshot judged
      # at the run's creation and for an hour after it. Fork pull requests remain on GitHub's runners.
      - id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          # The run's snapshot, used when the live read is refused (the workflow token may lack Variables access).
          VARS_ENABLED: ${{ vars.DYNA_CI_SELF_HOSTED }}
          VARS_LEASE: ${{ vars.DYNA_CI_POOL_UNTIL }}
          # ARC also serves sunrise-pool: SUNRISE_POOL_ARC=true keeps the gate there while Dyna's lease has lapsed.
          POOL: sunrise-pool
          VARS_ARC: ${{ vars.SUNRISE_POOL_ARC }}
          EVENT: ${{ github.event_name }}
          SAME_REPO: ${{ steps.gate.outputs.trusted || (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: bash tools/ci/dyna_ci_route.sh >> "$GITHUB_OUTPUT"
      - id: hosted
        if: steps.selection.outputs.rust_required != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on a fork's pull request: boat_health.py then reads what boat-recovery published.
          BOAT_CI: ${{ vars.BOAT_CI }}
          BOAT_FALLBACK: ${{ inputs.github-fallback && 'true' || 'false' }}
          BOAT_USERS: ${{ vars.BOAT_CI_USERS }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
          ACTOR: ${{ github.triggering_actor }}
        run: python3 tools/ci/boat_health.py

  # Fork PR tokens cannot dispatch or cancel runs. The trusted default-branch
  # boat-recovery workflow cancels/reruns outages; changes reads the previous attempt.
  # Same-run fallback jobs would leave the original queued checks pending, not green.
  boat-watch:
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.hosted_label == 'boat-large' && needs.changes.outputs.self_hosted != 'true' && needs.changes.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 tools/ci/boat_watch.py

  # The conflict-hotspot churn report (tools/hotspots/README.md), on the nightly schedule only, on GitHub's runner:
  # replays the last 3 days of merges with `git merge-tree` (git 2.38 or newer) and rewrites one issue. No build.
  # Never a gate: the job and each step continue on error, so a failure or a timeout never fails the run.
  churn-report:
    if: github.repository == 'sunrise-org/sunrise' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request heads and upstream's main
        id: fetch
        continue-on-error: true
        run: |
          git fetch -q --no-tags origin '+refs/pull/*/head:refs/pull/*/head'
          git fetch -q --no-tags https://github.com/horizon-rust/horizon.git main:refs/remotes/upstream/main
      - name: Update the churn report issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Conflict hotspots: churn report'
          FETCHED: ${{ steps.fetch.outcome }}
        run: |
          git --version
          python3 tools/hotspots/measure.py --days 3 --report > "$RUNNER_TEMP/report.md"
          {
            echo "> 🤖 Filed by Aria's agent swarm, Dyna, not by Aria."
            echo
            if [ "$FETCHED" != success ]; then
              echo "Fetching the PR heads or upstream's main failed: some PRs show as a commit, and syncs may count as PRs."
              echo
            fi
            head -c 60000 "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | sed -n '1p')
          if [ -n "$number" ]; then
            gh issue edit "$number" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  # Lint and verify use separate Dyna slots when the pool is available; each slot's build folder persists.
  # Outside contributors and pool-down runs stay on GitHub's runners with snapshot caches.
  lint:
    # Dyna's large runner for main's pushes and this repository's own pull requests (owner, 2026-11-05): its
    # build folder persists, so clippy re-checks only what changed. A fork's pull request, or a run while the
    # pool is down, stays on GitHub's runners with the snapshot cache below.
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && (needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'sunrise-pool' || 'ubuntu-latest') || needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'sunrise-pool' || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    # Recent green lint peaked at 53.5 minutes on a cold runner (including the wasm check).
    # Cold GitHub/boat lint was not represented in that sample; retain its previous allowance.
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 60 || github.event_name == 'pull_request' && 75 || 100 }}
    env:
      # dyna (Dyna's pool: persistent build folder, no sudo), boat (a fresh VM like GitHub's, 16 GiB) or github.
      RUNNER_KIND: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'dyna' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Documentation needs no Rust lint
        if: needs.changes.outputs.rust_required == 'false'
        run: echo 'Rust lint is not selected; repository hygiene still runs.'
      # Not diff-selected: any tracked file can contain a captured tool notice.
      - uses: actions/checkout@v4
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_sha }}
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.rust_required != 'false' && env.RUNNER_KIND == 'dyna'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the runner image's packages
        if: needs.changes.outputs.rust_required != 'false'
        env:
          HOSTED: ${{ env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat' }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $(grep -v '^#' tools/ci/runner-packages.txt)
          else
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            # The slot's build folder persists between jobs; point the checkout's target at it.
            mkdir -p "$CARGO_TARGET_DIR"
            ln -s "$CARGO_TARGET_DIR" target
            # Keep clippy-driver direct, but reuse sccache for ordinary dependency compilations.
            echo "RUSTC_WRAPPER=$GITHUB_WORKSPACE/tools/ci/compiler-cache.sh" >> "$GITHUB_ENV"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      # No lint snapshot on GitHub's runners: ci-cache.yml's 2 GB every 6 hours pushed the release caches (the SDK's and
      # the launcher's) out of the repository's 10 GB, and those come first. A GitHub-hosted lint builds from cold.
      # A Dyna runner builds as many crates at once as its CPU quota allows within its memory, about 3 GiB
      # per large rustc (tools/ci/cargo_jobs.py); boat's 16 GiB VM keeps four. A cargo flag, not
      # CARGO_BUILD_JOBS: sccache hashes CARGO_* variables, which would split the runners' cache from the boxes'.
      - name: Choose build parallelism
        if: needs.changes.outputs.rust_required != 'false'
        run: |
          case "$RUNNER_KIND" in
            dyna) jobs="-j$(python3 tools/ci/cargo_jobs.py --job-mib 3072)" ;;
            boat) jobs=-j4 ;;
            *) jobs= ;;
          esac
          echo "JOBS=$jobs" | tee -a "$GITHUB_ENV"
      # A fresh checkout otherwise makes every workspace source newer than the cached artifacts.
      # Only byte-identical Git objects regain their cached mtimes; changed inputs stay new.
      - name: Restore unchanged source timestamps
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes-v2.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Setup done
        id: setup
        run: 'true'
      - name: Check repository artifacts and workflow YAML
        id: check_repository_artifacts_and_workflow_yaml
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_repository_hygiene.py
      - name: Check mod API boundary
        id: check_mod_api_boundary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: python3 tools/ci/check_api_boundary.py --source-only
      - name: Check formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        id: formatting
        run: |
          python3 tools/ci/format_scan.py
      - name: Lint native targets
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        id: native-lint
        run: python3 tools/ci/check_warnings.py cargo clippy $JOBS --keep-going --workspace --all-targets
      # The full boundary audit: the mod API's generated signatures (mod_api_generated*.rs, written by sunrise-mod-vocab's
      # build script during the lint above), which the source-only check cannot see. Only Cargo's build-script outputs
      # are scanned: the persistent target holds far more.
      - name: Check generated mod API signatures
        id: generated_api_boundary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.rust_required != 'false' && steps.native-lint.outcome == 'success' }}
        run: python3 tools/ci/check_api_boundary.py --generated-root target/debug/build
      - name: Lint the server build without sound or controllers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        id: server-lint
        run: python3 tools/ci/check_warnings.py cargo clippy $JOBS --keep-going -p sunrise-client -p sunrise-game -p sunrise-mod-host --all-targets --no-default-features
      - name: The mod API builds for wasm32
        id: the_mod_api_builds_for_wasm32
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: cargo check $JOBS --keep-going -p sunrise-mod-api --target wasm32-unknown-unknown --locked
      # The prebuilt SDK's own feature graph: a release --lib build with prefer-dynamic and warnings rejected, as
      # tools/prebuilt_game.py builds it, for the host and for the Windows archive (system-allocator there,
      # cargo_features). The checks above unify test and dev features (test-support) into one host build, which hid
      # an unused import (Linux) and a unix-only binding (Windows) from everything but the SDK builds on main. Own
      # target folders, one per target so the two run at once: these flags would otherwise invalidate the workspace's
      # artifacts for the other steps. Each check is a chain of single-threaded crate checks (rollup 13: host 5.9 and
      # Windows 5.6 minutes one after the other, under 2 of the runner's 8 CPUs busy), so together they take about
      # as long as one; each gets half the job's crate slots to stay within its memory.
      # --target leaves host units uncapped as before; stable Cargo has no host-rustflags, so their denies can stop dependents.
      - name: The prebuilt SDK's host and Windows libraries build without warnings
        id: sdk_libraries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.rust_required != 'false' }}
        env:
          # MinGW ignores mimalloc's MSVC pragmas. CFLAGS replaces cc's default warning flags,
          # so retain -Wall/-Wextra for both mimalloc and hidapi; silence only unknown pragmas.
          CFLAGS_x86_64_pc_windows_gnu: -Wall -Wextra -Wno-unknown-pragmas
        run: |
          # hidapi and libmimalloc-sys compile C for the target in their build scripts.
          if ! command -v x86_64-w64-mingw32-gcc > /dev/null; then
            echo "::error::x86_64-w64-mingw32-gcc is missing: the Windows SDK check needs MinGW (gcc-mingw-w64-x86-64 in the ci-runner image)"
            exit 1
          fi
          rustup target add x86_64-pc-windows-gnu
          host=$(rustc -vV | awk '/^host:/ {print $2}')
          half=${JOBS:+-j$(( (${JOBS#-j} + 1) / 2 ))}
          check() {  # name, then the cargo arguments; the output waits in a log until both have finished
            local name=$1 started=$SECONDS status=0
            shift
            env -u CARGO_ENCODED_RUSTFLAGS RUSTFLAGS='-C prefer-dynamic' \
              python3 tools/ci/check_warnings.py cargo check $half --keep-going --locked -p sunrise-mod-host --lib --profile release \
                "$@" > "$RUNNER_TEMP/sdk-$name.log" 2>&1 || status=$?
            echo "SDK library check $name: $((SECONDS - started)) s" >> "$RUNNER_TEMP/sdk-times"
            return $status
          }
          check host --target-dir target/sdk-check --target "$host" & host_check=$!
          # The real build is a dylib, which Cargo never LTOs; a --lib check under the release profile's thin LTO
          # builds the dependencies for linker-plugin LTO, which rustc refuses with prefer-dynamic on Windows.
          # A check generates no code, so LTO changes no warning or cfg it reports.
          check windows --target-dir target/sdk-check-windows --target x86_64-pc-windows-gnu --features system-allocator \
            --config profile.release.lto=false & windows_check=$!
          failed=
          wait "$host_check" || failed="$failed host"
          wait "$windows_check" || failed="$failed windows"
          for name in host windows; do
            case " $failed " in
              *" $name "*) echo "SDK library check $name failed:"; cat "$RUNNER_TEMP/sdk-$name.log" ;;
              *) echo "::group::SDK library check $name"; cat "$RUNNER_TEMP/sdk-$name.log"; echo "::endgroup::" ;;
            esac
          done
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/sdk-times"
          if [ -n "$failed" ]; then
            echo "::error::The prebuilt SDK's library has warnings or errors for:$failed (its output is above)"
            exit 1
          fi
      - name: Report lint compiler cache
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        run: |
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Peak includes page cache; oom_kill records OOM kills, anon is only end-of-job residue.
          grep usage_usec /sys/fs/cgroup/cpu.stat || true
          echo "memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unavailable)"
          grep '^oom_kill ' /sys/fs/cgroup/memory.events 2>/dev/null || echo "oom_kill unavailable"
          awk '/^anon / {print "anon at job end", $2}' /sys/fs/cgroup/memory.stat 2>/dev/null || echo "anon at job end unavailable"
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py


  verify:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.heavy == 'true') }}
    runs-on: ${{ needs.changes.outputs.rust_required == 'false' && (needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'sunrise-pool' || 'ubuntu-latest') || needs.changes.outputs.self_hosted == 'true' && 'sunrise-pool' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && fromJSON('["self-hosted", "linux", "playsunrise-ci"]') || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && 50 || 45 }}
    # Dyna's runner image now carries lavapipe, Mesa's software Vulkan driver, for ignored-tests' `gpu` tests.
    # verify's tests were written to skip GPU work when no adapter exists, and one of them
    # (gfx::frame_gen::optical_flow, horizon-rust/horizon#8627) fails on lavapipe, so verify hides the driver and runs
    # exactly as before. ignored-tests is where the GPU tests run.
    env:
      VK_ICD_FILENAMES: /nonexistent/no-vulkan-in-verify.json
      VK_DRIVER_FILES: /nonexistent/no-vulkan-in-verify.json
      # With Vulkan hidden, a runner with Mesa's GL software adapter (boat's image) would still run the GPU tests,
      # on GL, and fail (#2841); Vulkan only leaves every runner with no adapter, so GPU tests skip here everywhere.
      WGPU_BACKEND: vulkan
      RUNNER_KIND: ${{ needs.changes.outputs.self_hosted == 'true' && 'dyna' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && 'other' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_sha }}
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.tooling_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          python-version: '3.12'
      # What the slot's build folder holds before this job writes anything: Dyna mounts /build per slot for
      # reuse across jobs, and an empty one means a cold build (no target, no registry, no toolchain).
      - name: Report what the build folder holds at job start
        if: needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        # A report only: an unreadable folder or a failed du/find/findmnt never fails the job.
        continue-on-error: true
        run: |
          # RUSTUP_HOME is set by a later step (tools/ci/dyna_ci_deps.sh): read its folder directly.
          for dir in "${DYNA_CI_BUILD:-/build}" "${CARGO_TARGET_DIR:-}" "${CARGO_HOME:-}/registry" "${DYNA_CI_BUILD:-/build}/rustup/toolchains"; do
            if [ ! -d "$dir" ]; then echo "build-folder $dir: absent"; continue; fi
            files=$(du -s --inodes "$dir" 2>/dev/null | cut -f1 || true)
            size=$(du -sh "$dir" 2>/dev/null | cut -f1 || true)
            oldest=$(find "$dir" -maxdepth 2 -printf '%TY-%Tm-%TdT%TH:%TM\n' 2>/dev/null | sort | sed -n '1p' || true)
            mount=$(findmnt -n -o SOURCE,TARGET -T "$dir" 2>/dev/null | sed -n '1p' || true)
            echo "build-folder $dir: entries=${files:-?} size=${size:-?} oldest=${oldest:-none} mount=${mount:-?}"
          done | tee -a "$GITHUB_STEP_SUMMARY"
          # Size against this host's cap (tools/ci/dyna-slot-caps.txt): over it, Dyna empties target/ before the next job.
          host=$(sed -n 's/^dyna-ci-\(.*\)-[0-9a-f]\{8\}$/\1/p' <<< "${RUNNER_NAME:-}")
          cap=$(awk -v h="$host" '$1 == h {print $2}' tools/ci/dyna-slot-caps.txt 2>/dev/null || true)
          used=$(du -s --block-size=1G "${DYNA_CI_BUILD:-/build}" 2>/dev/null | cut -f1 || true)
          echo "build-folder cap: host=${host:-?} size=${used:-?} GiB cap=${cap:-80} GiB" | tee -a "$GITHUB_STEP_SUMMARY"
          # What takes the room, toward that cap.
          du -sh "${DYNA_CI_BUILD:-/build}"/* "${CARGO_TARGET_DIR:-/nonexistent}"/* 2>/dev/null | sort -rh | sed -n '1,12p' | sed 's/^/build-folder part /' | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Each kept toolchain and its components: a test runs rustfmt under whichever toolchain it selects.
          for toolchain in "${DYNA_CI_BUILD:-/build}"/rustup/toolchains/*/; do
            [ -f "$toolchain/lib/rustlib/components" ] || continue
            echo "build-folder toolchain $(basename "$toolchain"): $(sed 's/-x86_64.*//;s/-aarch64.*//' "$toolchain/lib/rustlib/components" | sort -u | tr '\n' ' ')"
          done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain and the runner image's packages
        if: needs.changes.outputs.rust_required != 'false'
        env:
          HOSTED: ${{ env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends $(grep -v '^#' tools/ci/runner-packages.txt)
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      # Registry dependencies, from the snapshot ci-cache.yml publishes from main every 6 hours; pull requests only
      # read it. The workspace crates are rebuilt: their snapshot was 3 GB of the repository's 10 GB of caches.
      # Profile overrides in Cargo.toml are part of rust-cache's key; unchanged dependencies still restore.
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          shared-key: verify-deps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Use persistent verify build artifacts
        if: needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: |
          mkdir -p "${CARGO_TARGET_DIR:?}"
          if [ ! -e target ] && [ ! -L target ]; then
            ln -s "$CARGO_TARGET_DIR" target
          elif [ ! target -ef "$CARGO_TARGET_DIR" ]; then
            echo '::error::Existing target path does not point to CARGO_TARGET_DIR; refusing to replace it.'
            exit 1
          fi
      # The runner's CPU quota within its memory on Dyna, four on boat, Cargo's default elsewhere. 4 GiB a rustc, not
      # lint's 3: this job compiles gameplay twice with code generation (the lib and the executable test targets), and
      # at five a 16 GiB runner's compile was killed for memory (signal 9).
      - name: Choose build parallelism
        if: needs.changes.outputs.rust_required != 'false'
        run: |
          case "$RUNNER_KIND" in
            dyna) jobs="-j$(python3 tools/ci/cargo_jobs.py --job-mib 4096)" ;;
            boat) jobs=-j4 ;;
            *) jobs= ;;
          esac
          echo "JOBS=$jobs" | tee -a "$GITHUB_ENV"
      # Pair the retained artifacts with lint's input snapshot. Cargo still decides freshness;
      # only byte-identical Git objects regain their previous source timestamps.
      - name: Restore unchanged source timestamps
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/source_mtimes.py target/ci-source-mtimes-v2.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      # sunrise-client rustc processes take several GB each; $JOBS (chosen above) fits them in the runner's
      # memory. Formatting and lint run in parallel (the lint job), so this job only tests.
      # Libraries, binaries and integration tests, then doc tests: not the ~275 examples, which the lint job already
      # type-checks.
      # cargo test, not nextest: nextest's process per test reloads each binary's shared tables for every test, and on
      # these 4-core runners it was no faster (#4978).
      - name: Setup done
        id: setup
        run: 'true'
      - name: Build the runtime holder test actor
        id: actor
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        # The command lives in tools/ci/ignored_shards.py PREPARE, which the daily run uses too.
        run: python3 tools/ci/ignored_shards.py --prepare sunrise-mod-package $JOBS
      # Compile first, apart from running: the build's time and its slowest units show on their own.
      - name: Build Rust core test binaries
        id: core_build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        # Build the exact test graph on green. A workspace proc-macro can have different build/test
        # dependency profiles; cargo build first would make cargo test compile its consumers again.
        run: |
          # Keep other compiles parallel, but prevent the two large lib tests from exhausting memory together.
          export SUNRISE_TEST_RUSTC_WRAPPER="${RUSTC_WRAPPER:-}"
          export RUSTC_WRAPPER="$GITHUB_WORKSPACE/tools/ci/test-compile-lock.sh"
          build_log=$(mktemp)
          trap 'rm -f "$build_log"' EXIT
          if cargo test $JOBS --profile test --workspace --lib --bins --tests --no-run --timings 2>&1 | tee "$build_log"; then
            exit 0
          fi
          # Keep the fast parallel build on green. A killed compile gets one retry of the
          # same test graph, with finished units cached and no overlapping rustc processes.
          if grep -Eq 'Compile terminated by signal [0-9]+|signal: [0-9]+, SIG[A-Z]+|terminated with signal [0-9]+' "$build_log"; then
            failed_units=$(grep 'error: could not compile' "$build_log" | tr '\n' ';' || true)
            echo "::warning::A compile was killed by a signal; retrying the test build with -j1. Failed units: $failed_units"
            if cargo test -j1 --profile test --workspace --lib --bins --tests --no-run --timings; then
              exit 0
            fi
          fi
          # Only red runs pay for the other graph, to collect independent targets' errors too.
          echo "::error::The test build failed (its errors are above); building again with --keep-going to list every target's errors."
          if cargo build $JOBS --keep-going --profile test --workspace --lib --bins --tests; then
            # Main 9918e72ba0: two compiles killed by signal 9, then this build passed and the step ended with no message.
            echo "::error::The --keep-going build passed, but it builds a different graph and does not clear the failed test build: check the errors above, including any 'signal 9' (a compile killed, usually for memory), before rerunning."
          fi
          exit 1
      # What bounds the build: the slowest compile units, from the report --timings writes.
      - name: Slowest compile units
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' }}
        continue-on-error: true
        run: |
          python3 tools/ci/cargo_timings.py target/cargo-timings/cargo-timing.html | tee -a "$GITHUB_STEP_SUMMARY"
          # The points build script's phases (seconds since it started), from the file it writes beside its output.
          for timing in target/debug/build/sunrise-mod-points-*/out/points-timing.txt; do
            [ -f "$timing" ] || continue
            { echo "points build script phases:"; cat "$timing"; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
      # Binaries run normally, three at a time, under the inet/resolver preload guard. Only a binary
      # recording a violation is rerun per test to name culprits, even if they swallow the refusal.
      # The guard library is built here only; the daily run does not preload it. Unix sockets remain available.
      - name: Test Rust core and voxel kernel correctness
        id: test_rust_core_and_voxel_kernel_correctness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') && steps.core_build.outcome == 'success' && steps.actor.outcome == 'success' }}
        run: |
          cc -shared -fPIC -O2 -Wall -Wextra -Werror tools/ci/network_guard.c -o target/network_guard.so
          python3 tools/ci/run_test_binaries.py --jobs 3 --time-limits 2,5 --network-guard target/network_guard.so --no-data-skips -- cargo test $JOBS --profile test --workspace --lib --bins --tests
      # Prepared-data content-root tests stay in the existing client-lib data leg.
      # Running them again here without the data only rebuilds targets before they return early.
      # One genuine pinned export also validates source staging and listed slots.
      # Outside tests/ discovery: the later offline suite must not stage it again.
      # Keep this before doc tests so their failures cannot hide stale slots.
      - name: Build the source stage generator (test profile)
        id: stage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: |
          started=$SECONDS
          cargo build $JOBS --locked --profile test -p sunrise-mod-api-gen --bin sunrise-stage --message-format=json-render-diagnostics > "$RUNNER_TEMP/stage-artifacts.jsonl"
          echo "Stage generator build: $((SECONDS - started))s"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          artifacts = [json.loads(line) for line in Path(os.environ["RUNNER_TEMP"], "stage-artifacts.jsonl").read_text().splitlines()]
          executables = {item["executable"] for item in artifacts
                         if item.get("reason") == "compiler-artifact"
                         and item["target"]["name"] == "sunrise-stage"
                         and "bin" in item["target"]["kind"]
                         and not item["profile"]["test"] and item.get("executable")}
          if len(executables) != 1:
              raise SystemExit(f"expected one normal sunrise-stage executable, got {executables}")
          executable = str(Path(executables.pop()).resolve(strict=True))
          if "\r" in executable or "\n" in executable:
              raise SystemExit("sunrise-stage executable path must not contain CR or LF")
          with open(os.environ["GITHUB_ENV"], "a") as environment:
              environment.write(f"SUNRISE_STAGE_TOOL={executable}\n")
          PY
      - name: Report the mod API surface change
        id: report_the_mod_api_surface_change
        # What this pull request changes in what mods can name, in the job summary: the head's sunrise-stage exports
        # the merge base and this tree, then classifies the diff (tools/ci/surface_report.py). It fails when this
        # tree cannot be exported, for a stale or unreadable new change note, and, with tools/ci/surface.toml's
        # gate on, for a breaking change no new note declares.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false' && (github.event_name == 'pull_request' || inputs.pr != '')) && steps.stage.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/surface_report.py
      - name: Validate prebuilt source stage and listed slots
        id: validate_prebuilt_source_stage_and_listed_slots
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') && steps.stage.outcome == 'success' }}
        run: python3 tools/ci/test_stage_catalog.py -v
      - name: Test Rust documentation examples
        id: test_rust_documentation_examples
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: cargo test $JOBS --no-fail-fast --profile test --workspace --doc
      - name: No Rust work selected
        if: needs.changes.outputs.rust_required == 'false'
        run: echo 'No Rust work selected; static checks report independently.'
      - name: Report test compiler cache
        if: ${{ !cancelled() && needs.changes.outputs.rust_required != 'false' && needs.changes.outputs.self_hosted == 'true' }}
        run: |
          sccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Peak includes page cache; oom_kill records OOM kills, anon is only end-of-job residue.
          grep usage_usec /sys/fs/cgroup/cpu.stat || true
          echo "memory.peak $(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unavailable)"
          grep '^oom_kill ' /sys/fs/cgroup/memory.events 2>/dev/null || echo "oom_kill unavailable"
          awk '/^anon / {print "anon at job end", $2}' /sys/fs/cgroup/memory.stat 2>/dev/null || echo "anon at job end unavailable"
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py


  # Source checks and isolated compiler fixtures, never a second game build or game target cache.
  # A contributor's pull request gets this instead of lint: the same repository checks and formatting, nothing that
  # compiles. Formatting alone never blocks a merge (room rule); lint repeats it on the heavy runs.
  format:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.heavy != 'true'
    # Only pull requests outside the gate run it, so it is never a gate job: GitHub's runner, leaving Dyna's to gates.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check repository artifacts and workflow YAML
        run: python3 tools/ci/check_repository_hygiene.py
      - name: Check mod API boundary
        if: needs.changes.outputs.rust_required != 'false'
        run: python3 tools/ci/check_api_boundary.py --source-only
      - name: Install rustfmt on the pinned Rust
        env:
          DYNA: ${{ runner.environment != 'github-hosted' }}
        run: |
          if [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt
      - name: Check formatting
        run: |
          python3 tools/ci/format_scan.py
          (cd launcher && cargo fmt --check)

  verify-static:
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.result != 'skipped' }}
    # A contributor's pull request gets GitHub's runners: these checks compile nothing heavy, and
    # its only two checks must not depend on a paid pool's balance.
    # A pull request outside the gate: GitHub's runner, never a paid pool or our own (it gates nothing).
    # On our pool (sunrise-pool): the work is serial Python, git and small fixture compiles, which GitHub's 4-CPU runner
    # finishes in 8 to 11 minutes, so eight CPUs only took a large slot from the gate's compiling jobs.
    runs-on: ${{ needs.changes.outputs.heavy != 'true' && 'ubuntu-latest' || needs.changes.outputs.rust_required == 'false' && (needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 'sunrise-pool' || 'ubuntu-latest') || needs.changes.outputs.trusted != 'true' && 'ubuntu-latest' || needs.changes.outputs.self_hosted == 'true' && 'sunrise-pool' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && fromJSON('["self-hosted", "linux", "playsunrise-ci"]') || needs.changes.outputs.hosted_label || 'ubuntu-latest' }}
    timeout-minutes: ${{ needs.changes.outputs.self_hosted == 'true' && needs.changes.outputs.trusted == 'true' && 20 || 45 }}
    # Dyna's runner image now carries lavapipe, Mesa's software Vulkan driver, for ignored-tests' `gpu` tests.
    # verify's tests were written to skip GPU work when no adapter exists, and one of them
    # (gfx::frame_gen::optical_flow, horizon-rust/horizon#8627) fails on lavapipe, so verify hides the driver and runs
    # exactly as before. ignored-tests is where the GPU tests run.
    env:
      VK_ICD_FILENAMES: /nonexistent/no-vulkan-in-verify.json
      VK_DRIVER_FILES: /nonexistent/no-vulkan-in-verify.json
      # With Vulkan hidden, a runner with Mesa's GL software adapter (boat's image) would still run the GPU tests,
      # on GL, and fail (#2841); Vulkan only leaves every runner with no adapter, so GPU tests skip here everywhere.
      WGPU_BACKEND: vulkan
      RUNNER_KIND: ${{ needs.changes.outputs.heavy != 'true' && 'github' || needs.changes.outputs.trusted != 'true' && 'github' || needs.changes.outputs.self_hosted == 'true' && 'dyna' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && 'other' || startsWith(needs.changes.outputs.hosted_label, 'boat') && 'boat' || 'github' }}
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@v4
        id: checkout
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_sha }}
      # Public-tree ranges and sync ancestry need full history of this exact commit,
      # not every branch and tag. The Rust job only needs its checkout's HEAD and tracked files.
      - name: Fetch this commit's history
        timeout-minutes: 11
        env:
          FETCH_STEP: Fetch this commit's history
        # On our runners the slot's history mirror makes this a short fetch (tools/ci/history_fetch.sh).
        run: bash tools/ci/history_fetch.sh
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.tooling_required != 'false' && (env.RUNNER_KIND == 'github' || env.RUNNER_KIND == 'boat')
        with:
          python-version: '3.12'
      # Offline tooling compiles tiny standalone fixtures even when no game Rust changed.
      # Install their tools explicitly rather than making missing compilers turn cases into skips.
      - name: Install Rust tools for isolated tooling fixtures
        if: needs.changes.outputs.rust_required != 'false' || needs.changes.outputs.tooling_required != 'false'
        env:
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      - name: Setup done
        id: setup
        run: 'true'
      - name: Check generated extension tag catalog
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/surface_extension_tags.py --check
      # A pull request adds only its own commits to main, so it reads those; main's pushes read every ref's history.
      - name: Keep game artifacts out of Git
        id: keep_game_artifacts_out_of_git
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/check_public_tree.py
          if [ "$EVENT" = pull_request ]; then
            python3 tools/check_public_tree.py --range "$BASE_SHA..$HEAD_SHA"
          else
            python3 tools/check_public_tree.py --history
          fi
      - name: Check duplicate public native functions
        id: check_duplicate_public_native_functions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: python3 tools/sync_upstream.py --check
      # docs/layers.md#built-in-addresses: every built-in outside address in the Sunrise layer's home; the rest only shrinks.
      - name: Built-in addresses stay in their home
        id: built_in_addresses_stay_in_their_home
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_addresses.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      # Fixed conflict hotspots stay fixed: no SUMMARY.md line for a discovered book page, at most 5 launcher
      # language files outside a rollup or sync, no growth of hooks/notes.rs. Measured against the base as above.
      # The branch name counts only from this repository: a fork could name its branch like a rollup.
      - name: Fixed hotspots stay fixed
        id: fixed_hotspots_stay_fixed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ needs.changes.outputs.trusted == 'true' && github.head_ref || '' }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: python3 tools/hotspots/check_guards.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge} --branch "$BRANCH" --labels "$LABELS"
      # sunrise-mod-wasm-wire-loopback's build.rs declares tests/wire_loopback/*.rs: its root gains no module line and no test.
      - name: wire_loopback root does not grow
        id: wire_loopback_root_does_not_grow
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/hotspots/check_wire_loopback.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      - name: Vocabulary state has explicit ownership
        id: vocabulary_state_has_explicit_ownership
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/check_mod_vocabulary_state.py
      # One file per topic in tools/ci/ignored-tests/: well-formed rows, each test in one file, nothing else in the
      # folder, no file at the retired single-list path.
      - name: Ignored-test policy files read cleanly
        id: ignored_test_policy_files_read_cleanly
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_ignored_test_rows.py
      # The launcher split's gate (drafts plan B7): no manifest path, include or #[path] module leaves launcher/.
      - name: The launcher builds from its own files
        id: the_launcher_builds_from_its_own_files
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_launcher_standalone.py
      - name: The vanilla build reuses the default build's dependencies
        id: extras_features
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' && needs.changes.outputs.rust_required != 'false' }}
        run: python3 tools/ci/check_extras_features.py
      # The unit tier: a test that boots the game is #[ignore = "daily"]; the fixtures are in tools/ci/game-boot-fixtures.txt.
      - name: Game-boot tests are daily tests
        id: game_boot_tests_are_daily_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_game_boot_tests.py
      # The unit tier: a test that starts a child process is #[ignore = "daily"]; helpers in tools/ci/process-spawns.txt.
      - name: Process-starting tests are daily tests
        id: process_starting_tests_are_daily_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/check_process_tests.py
      # A test that reruns its own test executable by --exact must select it ignored or not, or a daily one checks nothing.
      - name: Test reruns select ignored tests too
        id: test_reruns_select_ignored_tests_too
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/ci/reexec_include_ignored.py --check
      # docs/layers.md: a crate depends only on its own layer or a lower one; today's exceptions only shrink.
      - name: Crates follow the layers
        id: crates_follow_the_layers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_layers.py ${BASE_SHA:+--base "$BASE_SHA" --pull-request-merge}
      # The prebuilt game's second dylib, the wasm runtime, holds no C library: one there is hidden from the game's
      # library, whose link then fails (#1596's mimalloc). Reads `cargo metadata` only, compiles nothing.
      - name: The wasm runtime links no native library
        id: wasm_runtime_links_no_native_library
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.outputs.rust_required != 'false') }}
        run: python3 tools/prebuilt_game.py links
      # tools/hotspots/README.md: a `pub use` brace list under the vocabulary's exports/ names at most 12 items, so two
      # PRs adding names don't conflict on rustfmt's re-wrap; today's longer lists only shrink.
      - name: Export lists stay short
        id: export_lists_stay_short
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/hotspots/check_lists.py
      # tools/hotspots/check_stand_ins.py: hand-written stand-ins of the dispatch tests and the wire loopback keep up
      # with the hooks and vocabulary traits they mirror, on the member PR itself instead of in a rollup's build.
      - name: Test stand-ins keep up with the API
        id: test_stand_ins_keep_up_with_the_api
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 tools/hotspots/check_stand_ins.py
      # Independent of the Rust job and earlier check results; require successful setup:
      # compiler fixtures after failed setup would add a second, misleading failure.
      - name: Python tests of the repository's tools
        id: python_tests_of_the_repository_s_tools
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.result == 'success' && needs.changes.outputs.tooling_required != 'false') }}
        run: python3 -m unittest discover -s tests -v --durations=25
      - name: Python tests of prepared-data tooling
        id: prepared_tooling_tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && (needs.changes.result == 'success' && needs.changes.outputs.tooling_required != 'false') }}
        run: python3 -m unittest discover -s tools/ci -p 'test_prepared_*.py' -v
      # The mod-host map's tables (#2534), built on main's pushes instead of committed, so no PR has to regenerate
      # them: docs/layering/mod-host-map.md points here. Main pushes only, never pull requests; about 17 s of Python
      # measured locally, no build.
      - name: Build the mod-host map tables
        id: mod_host_map
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'push' }}
        run: python3 tools/layering/scan_engine_mod_edges.py --map target/layering/mod-host-map-tables.md
      - name: Upload the mod-host map tables
        id: mod_host_map_upload
        if: ${{ !cancelled() && github.event_name == 'push' && steps.mod_host_map.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mod-host-map
          path: target/layering/mod-host-map-tables.md
          if-no-files-found: error
      - name: Report optional mod-host map upload failure
        if: ${{ !cancelled() && steps.mod_host_map_upload.outcome == 'failure' }}
        run: |
          echo '::warning::Optional mod-host-map artifact upload failed; inspect the upload step for details.'
          echo '### Optional mod-host-map artifact unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'The upload failed. Map generation remains a required step; the optional download is unavailable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py

  # The launcher is its own workspace (launcher/Cargo.toml), so verify's cargo runs never build it. A pull request that
  # changes it or a crate it builds is checked here, and so is every push to main: two pull requests can each pass
  # alone and break it together (#2059 and the registry ratings did, 2026-10-26).
  launcher:
    needs: changes
    if: needs.changes.outputs.launcher_required != 'false' && needs.changes.outputs.heavy == 'true'
    runs-on: ${{ needs.changes.outputs.self_hosted == 'true' && 'sunrise-pool' || !inputs.github-fallback && needs.changes.outputs.forced_github != 'true' && vars.SELF_HOSTED_CI == 'all' && needs.changes.outputs.trusted == 'true' && fromJSON('["self-hosted", "linux", "playsunrise-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatch with `pr`: that pull request's head; otherwise this event's commit.
          ref: ${{ needs.changes.outputs.pr_sha }}
      - name: Check Dyna dependencies (install fallback without root)
        if: needs.changes.outputs.launcher_required != 'false' && needs.changes.outputs.self_hosted == 'true'
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust and the headers GPUI links against
        if: needs.changes.outputs.launcher_required != 'false'
        env:
          HOSTED: ${{ runner.environment == 'github-hosted' }}
          DYNA: ${{ needs.changes.outputs.self_hosted }}
        run: |
          if [ "$HOSTED" = true ]; then
            bash tools/ci/install_launcher_deps.sh libxkbcommon-x11-dev libwayland-dev \
              libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
          elif [ "$DYNA" = true ]; then
            if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
              curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
            fi
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          bash tools/ci/rustup_install.sh --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.launcher_required != 'false' && runner.environment == 'github-hosted'
        with:
          workspaces: launcher
          shared-key: launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Setup done
        id: setup
        run: 'true'
      - name: Check launcher formatting
        id: check_launcher_formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo fmt --check
      - name: Lint launcher
        id: lint_launcher
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: python3 ../tools/ci/check_warnings.py cargo clippy $JOBS --keep-going --all-targets --locked
      - name: Test launcher library and binaries
        id: test_launcher_library_and_binaries
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo test $JOBS --no-fail-fast --locked --lib --bins
      - name: Test launcher storage
        id: test_launcher_storage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo test $JOBS --no-fail-fast --locked --test storage
      - name: Build launcher runtime holder test actor
        id: build_launcher_runtime_holder_test_actor
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: python3 ../tools/ci/ignored_shards.py --prepare sunrise-mod-package $JOBS
      - name: Test launcher runtime package
        id: test_launcher_runtime_package
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.build_launcher_runtime_holder_test_actor.outcome == 'success' }}
        working-directory: launcher
        env:
          JOBS: ${{ needs.changes.outputs.self_hosted == 'true' && '-j2' || '' }}
        run: cargo test $JOBS --no-fail-fast --manifest-path ../Cargo.toml --locked -p sunrise-mod-package --features runtime-process --lib
      - name: Summarize failed gate steps
        if: ${{ failure() && !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GATE_STEPS: ${{ toJSON(steps) }}
        run: python3 tools/ci/gate_summary.py

  # A dispatch with `pr`: posts the heavy jobs' results on that pull request's head. It runs none of its code, so it
  # alone holds the write permission, and only for commit statuses.
  pr-status:
    needs: [changes, lint, verify, verify-static, launcher]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pr != '' && needs.changes.outputs.pr_sha != ''
    # Five seconds of status posts after the gate: nothing waits on it, so it takes none of Dyna's counted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # Plain Python against the API: Dyna's runner image has no GitHub CLI.
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.changes.outputs.pr_sha }}
          RESULTS: ${{ toJSON(needs) }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          states = {"success": "success", "skipped": "success", "failure": "failure", "cancelled": "error"}
          for job in ("lint", "verify", "verify-static", "launcher"):
              result = json.loads(os.environ["RESULTS"])[job]["result"]
              body = {"state": states.get(result, "error"), "context": f"dispatched/{job}",
                      "description": f"dyna-checks dispatched on this head: {result}", "target_url": os.environ["RUN"]}
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['SHA']}",
                  data=json.dumps(body).encode(), method="POST",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=20):
                  pass
          PY

  # The fork's Dyna runners have the owner's prepared vanilla data in a read-only cache.
  prepared-output-check:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare-output-check && github.repository == 'sunrise-org/sunrise'
    runs-on: dyna-large
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Check prepared output digest
        run: |
          # Never reuse a completed preparation for this diagnostic, including a retry.
          for attempt in 1 2; do
            SUNRISE_PREPARE_KEY="${GITHUB_SHA:0:16}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt" \
              SUNRISE_PREPARE_EXPORT_DIGEST="$RUNNER_TEMP/export.digest" \
              SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local bash tools/ci/vanilla-data.sh
            exported=$(cat "$RUNNER_TEMP/export.digest")
            actual=$(python3 tools/prepare_output.py digest 2>/dev/null) || { echo "::error::prepared output digest unavailable"; exit 1; }
            { echo "fresh export $attempt: $exported"; echo "seeded export $attempt: $actual"; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          set +e
          python3 tools/prepare_output.py check > "$RUNNER_TEMP/output-check.log" 2>&1
          result=$?
          set -e
          expected=$(awk '!/^#/ && NF == 2 { value=$2 } END { print value }' crates/sunrise-prepare/output-versions.txt)
          { echo "prepared output check: $([ "$result" -eq 0 ] && echo pass || echo fail)"; echo "actual: $actual"; echo "expected: $expected"; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$result"
