# Sunrise's HDR extension (docs/shaders.md): asked for here, served by Sunrise alone, and on any
# other loader this pack runs its SDR path. A value has nothing after it on its line.
sunrise.hdr = true
#ifdef SUNRISE_CURVE
sunrise.hdr.tonemap = sunrise
#else
sunrise.hdr.tonemap = pack
#endif
# No vignette over the ramp and the display strip: the harness reads them as written.
vignette = false
